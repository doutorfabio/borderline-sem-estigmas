<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Mont;font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2)}
@font-face{font-family:Mont;font-weight:900;src:url(fonts/montserrat-latin-900-normal.woff2)}
@font-face{font-family:Frau;font-weight:900;font-style:italic;src:url(fonts/fraunces-latin-900-italic.woff2)}
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
#bg{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:50% 36%;will-change:transform}
#cap{position:absolute;left:540px;top:1368px;width:0;height:0}
#blk{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap}
.ln{display:flex;align-items:baseline;justify-content:center;gap:.26em;font-size:var(--fs)}
.w{display:inline-block;font:800 1em/1.12 Mont;color:#fff;letter-spacing:.005em;-webkit-text-stroke:2px rgba(0,0,0,.5);paint-order:stroke fill;text-shadow:0 5px 16px rgba(0,0,0,.7),0 1px 3px rgba(0,0,0,.65);transform-origin:50% 80%}
.w.hl{font:italic 900 1.52em/1.02 Frau;color:#EE2A22;-webkit-text-stroke:0;letter-spacing:0;text-shadow:0 6px 22px rgba(0,0,0,.85),0 2px 5px rgba(0,0,0,.8);padding:0 .04em}
#bub{position:absolute;left:540px;top:1368px;width:0;height:0}
#bb{position:absolute;left:0;top:0;transform:translate(-50%,-50%);opacity:0;white-space:nowrap}
#bx{position:relative;padding:30px 42px 30px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;font-size:var(--bf,48px);box-shadow:0 20px 54px rgba(0,0,0,.55)}
#bx.in{background:rgba(20,20,22,.93);border-radius:40px 40px 40px 10px;outline:1.5px solid rgba(255,255,255,.10)}
#bx.out{background:#F7F1E6;border-radius:40px 40px 10px 40px;align-items:flex-end}
.bl{display:flex;align-items:baseline;gap:.26em}
.bw{display:inline-block;font:800 1em/1.2 Mont;letter-spacing:.005em;transform-origin:50% 75%}
.bw.hl{font:italic 900 1.5em/1.05 Frau;padding:0 .05em}
#bx.in .bw{color:#fff}#bx.in .bw.hl{color:#FF3B30}
#bx.out .bw{color:#161616}#bx.out .bw.hl{color:#CC0000}
#btag{position:absolute;right:34px;top:-23px;padding:9px 20px 8px;border-radius:999px;background:#CC0000;color:#fff;font:800 26px/1 Mont;letter-spacing:.08em;box-shadow:0 6px 16px rgba(0,0,0,.35)}
#chip{position:absolute;left:540px;top:1168px;transform:translate(-50%,-50%);display:flex;align-items:center;gap:22px;padding:14px 30px 14px 28px;border-radius:999px;background:rgba(12,12,12,.72);box-shadow:0 8px 28px rgba(0,0,0,.45);opacity:0}
#num{font:900 58px/1 Mont;color:#fff;display:flex;align-items:baseline;overflow:hidden;white-space:nowrap}
#num small{font:800 30px/1 Mont;color:rgba(255,255,255,.6);margin-left:6px}
#bars{display:flex;align-items:center}
.bar{width:64px;height:12px;border-radius:6px;background:rgba(255,255,255,.28)}
.bar.on{background:#EE2A22}
#hook{position:absolute;left:108px;right:108px;top:214px;display:flex;flex-direction:column;align-items:center;text-align:center;opacity:0}
#hook .a{font:800 60px/1.1 Mont;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.6),0 1px 3px rgba(0,0,0,.5);white-space:nowrap}
#hook .b{font:italic 900 112px/1.02 Frau;color:#EE2A22;text-shadow:0 6px 24px rgba(0,0,0,.65),0 2px 5px rgba(0,0,0,.6);margin:4px 0 8px;white-space:nowrap}
#fade{position:absolute;inset:0;background:#000;opacity:0}
</style></head><body><div id="stage"><img id="bg"><div id="bub"><div id="bb"><div id="bx"></div></div></div><div id="cap"><div id="blk"></div></div>
<div id="chip"><div id="num"><span id="n">1</span><small>/3</small></div><div id="bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div></div>
<div id="hook"><div class="a">AS 3 PERGUNTAS DO</div><div class="b">BORDERLINE</div><div class="a">SOBRE O SEU PASSADO</div></div><div id="fade"></div></div>
<script src="data.js"></script><script>
const D=window.DATA,bg=document.getElementById('bg'),blk=document.getElementById('blk'),chip=document.getElementById('chip');
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),oc=p=>1-Math.pow(1-p,3),ob=p=>{const c=1.9;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const STRONG=[6.7333,8.5333,17.8333,21.5667,30.6];
let cur=-1,els=[],curB=-1,bels=[];const bb=document.getElementById('bb'),bx=document.getElementById('bx');
function build(i){blk.innerHTML='';els=[];const c=D.chunks[i];const fs=c.hero?92:68;blk.style.setProperty('--fs',fs+'px');
 for(const L of c.lines){const d=document.createElement('div');d.className='ln';for(const w of L){const s=document.createElement('span');s.className='w'+(w.hl?' hl':'');s.textContent=w.w;d.appendChild(s);els.push([s,w])}blk.appendChild(d)}
 let mw=0;for(const d of blk.children)mw=Math.max(mw,d.getBoundingClientRect().width);if(mw>760)blk.style.setProperty("--fs",(fs*760/mw).toFixed(2)+'px')}
window.setT=async function(t,frame){
 if(frame){bg.src='frames/'+String(frame).padStart(4,'0')+'.jpg';await bg.decode()}
 let z=1;for(const [a,b,z0,z1] of D.zooms)if(t>=a&&t<b){const p=(t-a)/(b-a);z=z0+(z1-z0)*(p*p*(3-2*p))}
 for(const c of STRONG)if(t>=c&&t<c+0.3)z+=0.03*Math.pow(1-(t-c)/0.3,2);
 if(t>=1.4&&t<2.7333)z*=1.13;
 for(const [a,b] of [[4.7,5.6667],[12.1,13.0333],[19.4,21.5667],[23.0,24.4667],[26.0,27.5],[29.0,30.6],[32.9,34.7333],[36.6,38.4333],[39.9,41.3]])if(t>=a&&t<b)z*=1.10;
 {const hk=document.getElementById('hook');hk.style.opacity=(t<3.6||(t>=19.9&&t<21.6))?1:Math.max(0,(3.7333-t)/0.1333);}
 bg.style.transform='scale('+z.toFixed(5)+')';
 let i=-1;for(let k=0;k<D.chunks.length;k++){const c=D.chunks[k];if(t>=c.t0-0.03&&t<c.t1&&!(t>=11.13&&c.e<11.13))i=k}
 if(i!==cur){cur=i;if(i>=0)build(i);else{blk.innerHTML='';els=[]}}
 for(const [s,w] of els){const p=cl((t-(w.s-0.03))/(w.hl?0.2:0.16));
  if(p<=0){s.style.opacity=0;continue}
  s.style.opacity=cl(p*3);
  if(w.hl){const e=oc(p);s.style.transform='translateY('+((1-e)*10).toFixed(2)+'px) scale('+(1.2-0.2*e).toFixed(4)+')'}
  else{const e=ob(p);s.style.transform='translateY('+((1-e)*24).toFixed(2)+'px) scale('+(0.92+0.08*e).toFixed(4)+')'}}
 {let bi=-1;for(let k=0;k<D.bubbles.length;k++){const B=D.bubbles[k];if(t>=B.t0&&t<B.t1)bi=k}
  if(bi!==curB){curB=bi;bx.innerHTML='';bels=[];if(bi>=0){const B=D.bubbles[bi];bx.className=B.side;bx.style.setProperty('--bf','48px');
    if(B.tag){const g=document.createElement('div');g.id='btag';g.textContent=B.tag;bx.appendChild(g)}
    for(const L of B.lines){const d=document.createElement('div');d.className='bl';for(const w of L){const s=document.createElement('span');s.className='bw'+(w.hl?' hl':'');s.textContent=w.w;d.appendChild(s);bels.push([s,w])}bx.appendChild(d)}
    bb.style.opacity=1;bb.style.transform='translate(-50%,-50%)';const mw=bx.getBoundingClientRect().width;if(mw>770)bx.style.setProperty('--bf',(48*(770-84)/(mw-84)).toFixed(2)+'px')}}
  if(bi<0){bb.style.opacity=0}else{const B=D.bubbles[bi],pi=cl((t-B.t0)/0.26),po=cl((B.t1-t)/0.13),e=ob(pi);
   bb.style.opacity=Math.min(cl(pi*3.5),po);bb.style.transformOrigin=(B.side==='in'?'0% 100%':'100% 100%');
   bb.style.transform='translate(-50%,-50%) translateY('+((1-e)*46-(1-po)*18).toFixed(2)+'px) scale('+(0.8+0.2*e).toFixed(4)+')';
   for(const [s,w] of bels){const p=cl((t-(w.s-0.03))/(w.hl?0.2:0.14));s.style.opacity=(0.26+0.74*cl(p*2.5)).toFixed(3);
    s.style.transform=w.hl?'scale('+(1+0.14*Math.sin(Math.PI*oc(p))).toFixed(4)+')':'translateY('+(-6*Math.sin(Math.PI*p)).toFixed(2)+'px)'}}}
 // chip
 let ch=null;for(const c of D.chip)if(t>=c.t0&&t<c.t1)ch=c;
 const c0=D.chip[0].t0,c1=D.chip[D.chip.length-1].t1;
 if(t<c0-0.02||t>=c1){chip.style.opacity=0}else{
  const pin=oc(cl((t-c0)/0.2)),pout=cl((c1-t)/0.18);chip.style.opacity=Math.min(pin,pout);
  const n=ch?ch.n:1,bars=document.querySelectorAll('.bar'),num=document.getElementById('num');
  let pop=1;if(ch&&ch.n<=3){const pp=cl((t-ch.t0)/0.18);pop=1.25-0.25*oc(pp)}
  chip.style.transform='translate(-50%,-50%) translateY('+((1-pin)*26).toFixed(2)+'px)';
  document.getElementById('n').textContent=Math.min(n,3);document.getElementById('n').style.display='inline-block';document.getElementById('n').style.transform='scale('+pop.toFixed(3)+')';
  let m=0;if(ch&&ch.merge!==undefined)m=oc(cl((t-ch.merge)/0.35));
  num.style.maxWidth=((1-m)*120).toFixed(1)+'px';num.style.opacity=(1-m);chip.style.gap=((1-m)*22)+'px';
  bars.forEach((b,k)=>{b.className='bar'+(k<Math.min(n,3)?' on':'');b.style.marginLeft=k?((1-m)*10).toFixed(2)+'px':'0';const r=6;
   b.style.borderRadius=(k==0?r:r*(1-m))+'px '+(k==2?r:r*(1-m))+'px '+(k==2?r:r*(1-m))+'px '+(k==0?r:r*(1-m))+'px'})}
 document.getElementById('fade').style.opacity=0;
 // bbox of visible text
 let b=null;for(const [s] of els){if(+s.style.opacity<=0)continue;const r=s.getBoundingClientRect();b=b?[Math.min(b[0],r.left),Math.min(b[1],r.top),Math.max(b[2],r.right),Math.max(b[3],r.bottom)]:[r.left,r.top,r.right,r.bottom]}
 if(+bb.style.opacity>0){for(const el of [bx,document.getElementById('btag')]){if(!el)continue;const r=el.getBoundingClientRect();b=b?[Math.min(b[0],r.left),Math.min(b[1],r.top),Math.max(b[2],r.right),Math.max(b[3],r.bottom)]:[r.left,r.top,r.right,r.bottom]}}
 {const hk=document.getElementById('hook');if(+hk.style.opacity>0)for(const el of hk.children){const r=el.getBoundingClientRect();b=b?[Math.min(b[0],r.left),Math.min(b[1],r.top),Math.max(b[2],r.right),Math.max(b[3],r.bottom)]:[r.left,r.top,r.right,r.bottom]}}
 if(+chip.style.opacity>0){const r=chip.getBoundingClientRect();b=b?[Math.min(b[0],r.left),Math.min(b[1],r.top),Math.max(b[2],r.right),Math.max(b[3],r.bottom)]:[r.left,r.top,r.right,r.bottom]}
 return b};
</script></body></html>
