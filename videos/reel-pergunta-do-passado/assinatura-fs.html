<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Corm;font-weight:600;src:url(fonts/cormorant-garamond-latin-600-normal.woff2)}
@font-face{font-family:Mont;font-weight:600;src:url(fonts/montserrat-latin-600-normal.woff2)}
html,body{margin:0;background:#F7F1E6}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;background:#F7F1E6;font-variant-ligatures:none}
#box{position:absolute;left:260px;top:560px;width:560px;height:560px}
#red{position:absolute;left:280px;top:0;width:280px;height:560px;background:#CC0000;transform-origin:0 50%;overflow:hidden}
#line{position:absolute;left:277px;top:0;width:6px;height:560px;background:#CC0000;transform-origin:50% 0}
#F,#S{position:absolute;top:0;width:280px;height:560px;display:flex;align-items:center;justify-content:center;font:600 440px/1 Corm}
#F{left:0;color:#141414}#S{left:0;color:#F7F1E6}
#F span,#S span{display:inline-block;transform:translateY(-12px)}
#nm{position:absolute;left:0;right:0;top:1196px;text-align:center;font:600 40px/1 Mont;color:#141414;white-space:nowrap}
</style></head><body><div id="st"><div id="box"><div id="line"></div><div id="F"><span>F</span></div><div id="red"><div id="S"><span>S</span></div></div></div><div id="nm">DR. FABIO SCHMIDT</div></div>
<script>
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),io=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,oc=p=>1-Math.pow(1-p,3),ox=p=>p>=1?1:1-Math.pow(2,-10*p);
const back=p=>{const c=1.4;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};const $=id=>document.getElementById(id);
window.setT=t=>{
 $('line').style.transform='scaleY('+io(cl(t/0.35)).toFixed(4)+')';
 const r=ox(cl((t-0.30)/0.5));$('red').style.transform='scaleX('+r.toFixed(4)+')';$('S').style.transform='scaleX('+(r>0.001?1/r:0).toFixed(4)+')';$('S').style.transformOrigin='0 50%';
 const f=cl((t-0.55)/0.5);$('F').firstChild.style.transform='translate('+((1-ox(f))*-70).toFixed(2)+'px,-12px)';$('F').style.opacity=cl(f*2);
 const s=cl((t-0.72)/0.5);$('S').firstChild.style.transform='translateY('+(-12+(1-back(s))*520).toFixed(2)+'px)';$('S').firstChild.style.opacity=s>0?1:0;
 const n=cl((t-1.15)/0.6);$('nm').style.letterSpacing=(0.9-0.48*oc(n)).toFixed(4)+'em';$('nm').style.textIndent=(0.9-0.48*oc(n)).toFixed(4)+'em';$('nm').style.opacity=oc(n);
};
</script></body></html>
