<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Mont;font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2)}
@font-face{font-family:Mont;font-weight:900;src:url(fonts/montserrat-latin-900-normal.woff2)}
@font-face{font-family:Frau;font-weight:900;font-style:italic;src:url(fonts/fraunces-latin-900-italic.woff2)}
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
#bg{position:absolute;left:0;top:0;width:1080px;height:1920px}
#cap{position:absolute;left:520px;top:960px;width:0;height:0}
#blk{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:0;white-space:nowrap;transform-origin:50% 50%}
.ln{display:flex;align-items:baseline;justify-content:center;gap:.34em;font-size:var(--fs)}
.w{display:inline-block;font:800 1em/1.12 Mont;color:#fff;letter-spacing:.005em;-webkit-text-stroke:2px rgba(0,0,0,.5);paint-order:stroke fill;text-shadow:0 5px 16px rgba(0,0,0,.75),0 1px 3px rgba(0,0,0,.7);transform-origin:50% 80%}
.w.hl{font:italic 900 1.5em/1.02 Frau;color:#EE2A22;-webkit-text-stroke:0;letter-spacing:0;text-shadow:0 6px 22px rgba(0,0,0,.85),0 2px 5px rgba(0,0,0,.8);padding:0 .04em}
</style></head><body><div id="stage"><img id="bg"><div id="cap"><div id="blk"></div></div></div>
<script src="data.js"></script><script>
const D=window.DATA,bg=document.getElementById('bg'),blk=document.getElementById('blk');
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),oc=p=>1-Math.pow(1-p,3),ob=p=>{const c=1.7;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
let cur=-1,els=[];
function build(i){blk.innerHTML='';els=[];const c=D.chunks[i];const fs=c.hero?84:64;blk.style.setProperty('--fs',fs+'px');
 for(const L of c.lines){const d=document.createElement('div');d.className='ln';for(const w of L){const s=document.createElement('span');s.className='w'+(w.hl?' hl':'');s.textContent=w.w;d.appendChild(s);els.push([s,w])}blk.appendChild(d)}
 let mw=0;for(const d of blk.children)mw=Math.max(mw,d.getBoundingClientRect().width);if(mw>740)blk.style.setProperty('--fs',(fs*740/mw).toFixed(2)+'px')}
window.setT=async function(t,frame){
 if(frame){bg.src='frames/'+String(frame).padStart(4,'0')+'.jpg';await bg.decode()}
 let i=-1;for(let k=0;k<D.chunks.length;k++){const c=D.chunks[k];if(t>=c.t0-0.03&&t<c.t1)i=k}
 if(i!==cur){cur=i;if(i>=0)build(i);else{blk.innerHTML='';els=[]}}
 // oscilacao suave do bloco: balanco lento, sem exagero
 if(i>=0){const c=D.chunks[i],age=t-c.t0,ph=i*1.7;
  const rot=1.1*Math.sin(age*2.2+ph),fy=4*Math.sin(age*2.9+ph*0.6);
  const pin=ob(cl((age+0.03)/0.22)),sc=0.94+0.06*pin;
  blk.style.transform='translate(-50%,-50%) translateY('+fy.toFixed(2)+'px) rotate('+rot.toFixed(3)+'deg) scale('+sc.toFixed(4)+')'}
 for(const [s,w] of els){const p=cl((t-(w.s-0.03))/(w.hl?0.22:0.16));
  if(p<=0){s.style.opacity=0;continue}
  s.style.opacity=cl(p*3);
  const live=t>=w.s-0.03&&t<w.e+0.05;
  if(w.hl){const e=oc(p);const pulse=live?0.05*Math.sin(Math.PI*cl((t-w.s)/Math.max(0.2,w.e-w.s))):0;
   s.style.transform='translateY('+((1-e)*10).toFixed(2)+'px) scale('+(1.22-0.22*e+pulse).toFixed(4)+')'}
  else{const e=ob(p);s.style.transform='translateY('+((1-e)*22-(live?3:0)).toFixed(2)+'px) scale('+(0.9+0.1*e+(live?0.035:0)).toFixed(4)+')';
   s.style.color=live||t<w.s?'#fff':'#F2ECE2'}}
 let b=null;for(const [s] of els){if(+s.style.opacity<=0)continue;const r=s.getBoundingClientRect();b=b?[Math.min(b[0],r.left),Math.min(b[1],r.top),Math.max(b[2],r.right),Math.max(b[3],r.bottom)]:[r.left,r.top,r.right,r.bottom]}
 return b};
</script></body></html>
