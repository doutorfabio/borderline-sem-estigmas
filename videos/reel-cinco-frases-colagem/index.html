<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Mont;font-weight:600;src:url(fonts/montserrat-latin-600-normal.woff2)}
@font-face{font-family:Mont;font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2)}
@font-face{font-family:Mont;font-weight:900;src:url(fonts/montserrat-latin-900-normal.woff2)}
@font-face{font-family:Frau;font-weight:900;font-style:italic;src:url(fonts/fraunces-latin-900-italic.woff2)}
html,body{margin:0;background:#151413}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;background:#171615;font-variant-ligatures:none}
#bg{position:absolute;inset:-60px;background:radial-gradient(120% 80% at 50% 45%,#242120 0%,#141312 70%)}
#grain{position:absolute;inset:0;opacity:.22;mix-blend-mode:overlay}
.scrap{position:absolute;background:#2c2926;opacity:.55}
#title{position:absolute;left:108px;right:130px;top:214px;display:flex;flex-direction:column;align-items:center;text-align:center}
#title .a{font:800 54px/1.12 Mont;color:#F3ECDF;white-space:nowrap;letter-spacing:.01em}
#title .b{font:italic 900 112px/1.04 Frau;color:#E8281F;white-space:nowrap;margin:2px 0 4px}
#dots{position:absolute;left:0;right:0;top:520px;display:flex;justify-content:center;gap:14px}
.dot{width:46px;height:10px;border-radius:5px;background:rgba(243,236,223,.18)}
.dot.on{background:#E8281F}
.card{position:absolute;left:150px;top:640px;width:780px;height:560px;transform-origin:50% 60%}
.paper{position:absolute;inset:0;background:#F4EEE3;box-shadow:0 26px 60px rgba(0,0,0,.55)}
.num{position:absolute;left:46px;top:22px;font:italic 900 170px/1 Frau;color:#E8281F}
.q{position:absolute;left:52px;right:52px;top:200px;font:italic 900 72px/1.08 Frau;color:#161514}
.tag{position:absolute;right:52px;top:44px;font:800 30px/1 Mont;letter-spacing:.14em;color:rgba(22,21,20,.45)}
.stamp{position:absolute;right:40px;bottom:46px;padding:14px 22px 12px;border:6px solid #E8281F;color:#E8281F;font:900 44px/1 Mont;letter-spacing:.04em;border-radius:10px;opacity:0;white-space:nowrap}
.back .num{left:0;right:0;text-align:center;top:150px;font-size:230px;color:rgba(232,40,31,.92)}
#sticker{position:absolute;left:66px;top:520px;width:270px;height:270px;opacity:0;z-index:50}
#sticker .ring{position:absolute;inset:0;border-radius:50%;background:#fff;box-shadow:0 14px 34px rgba(0,0,0,.55)}
#sticker img{position:absolute;left:12px;top:12px;width:246px;height:246px;border-radius:50%}
#cap{position:absolute;left:540px;top:1430px;width:0;height:0}
#blk{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;align-items:baseline;gap:.26em;white-space:nowrap;font-size:var(--fs,64px)}
.w{display:inline-block;font:800 1em/1.1 Mont;color:#fff;-webkit-text-stroke:2px rgba(0,0,0,.5);paint-order:stroke fill;text-shadow:0 4px 14px rgba(0,0,0,.7)}
.w.hl{font:italic 900 1.45em/1 Frau;color:#E8281F;-webkit-text-stroke:0;text-shadow:0 5px 18px rgba(0,0,0,.8)}
#fin{position:absolute;left:150px;top:640px;width:780px;opacity:0}
#fin .paper{position:relative;inset:auto;padding:56px 54px 60px}
#fin .t1{font:italic 900 96px/1 Frau;color:#E8281F}
#fin .t2{font:800 50px/1.15 Mont;color:#161514;margin-top:18px}
</style></head><body><div id="st"><div id="bg"></div><canvas id="grain" width="540" height="960"></canvas>
<div id="scraps"></div>
<div id="title"><div class="a">CINCO FRASES DO</div><div class="b">BORDERLINE</div><div class="a">QUE QUEREM DIZER FICA</div></div>
<div id="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
<div id="cards"></div>
<div id="mid" class="card" style="opacity:0"><div class="paper"></div><div class="q" style="top:70px;font-size:80px">Fique por perto.</div><div class="q" style="top:270px;font:800 50px/1.2 Mont;color:#161514">Pergunte uma vez,<br>com calma.</div></div><div id="fin"><div class="paper"><div class="t1">MANDA</div><div class="t2">pra quem você queria que entendesse o que você quis dizer.</div></div></div>
<div id="sticker"><div class="ring"></div><img id="sti" src="st_a.png"></div>
<div id="cap"><div id="blk"></div></div></div>
<script src="data.js"></script><script>
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),oc=p=>1-Math.pow(1-p,3),io=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const back=p=>{const c=1.6;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
// grain
{const c=document.getElementById('grain'),x=c.getContext('2d'),im=x.createImageData(540,960);for(let i=0;i<im.data.length;i+=4){const v=rnd()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}x.putImageData(im,0,0);c.style.width='1080px';c.style.height='1920px'}
// scraps
{const s=document.getElementById('scraps');for(let i=0;i<7;i++){const d=document.createElement('div');d.className='scrap';const w=160+rnd()*260,h=60+rnd()*140;d.style.cssText+=`left:${rnd()*1000-80}px;top:${rnd()*1800}px;width:${w}px;height:${h}px;transform:rotate(${rnd()*30-15}deg)`;d.style.clipPath=torn(w,h,6);s.appendChild(d)}}
function torn(w,h,j){const p=[];const n=Math.round(w/26),m=Math.round(h/26);for(let i=0;i<=n;i++)p.push(`${i/n*100}% ${rnd()*j/h*100}%`);for(let i=0;i<=m;i++)p.push(`${100-rnd()*j/w*100}% ${i/m*100}%`);for(let i=n;i>=0;i--)p.push(`${i/n*100}% ${100-rnd()*j/h*100}%`);for(let i=m;i>=0;i--)p.push(`${rnd()*j/w*100}% ${i/m*100}%`);return `polygon(${p.join(',')})`}
const Q=['Pode ir, eu tô acostumada.','Faz o que você quiser.','Esquece, não é nada.','Você vai cansar de mim.','Me deixa em paz.'];
const SM=['FICA COMIGO','ME ESCOLHE?','PERGUNTA DE NOVO','ME CONFIRMA','FICA POR PERTO'];
const cards=[];const cw=document.getElementById('cards');
for(let i=0;i<5;i++){const c=document.createElement('div');c.className='card';c.innerHTML=`<div class="paper"></div><div class="num">${i+1}</div><div class="q">${Q[i]}</div><div class="tag">O QUE DIZ</div><div class="stamp">${SM[i]}</div>`;c.querySelector('.paper').style.clipPath=torn(780,560,9);c.dataset.r=(rnd()*8-4).toFixed(2);cw.appendChild(c);cards.push(c)}
document.getElementById('fin').querySelector('.paper').style.clipPath=torn(780,420,9);
const dots=[...document.querySelectorAll('.dot')],stk=document.getElementById('sticker'),sti=document.getElementById('sti'),blk=document.getElementById('blk');
let curC=-1;
window.setT=t=>{
 const fr=Math.round(t*30);
 document.getElementById('bg').style.transform=`scale(${1+0.04*t/D.dur})`;
 document.getElementById('grain').style.transform=`translate(${(fr%3)*2}px,${(fr%2)*2}px)`;
 // cards
 const I=D.items;
 for(let i=0;i<5;i++){const c=cards[i],r=+c.dataset.r;let x=0,y=0,rot=r,op=1,sc=1,z=10-i;
  const tin=I[i]-0.15, tout=(i<4?I[i+1]:D.out1)-0.12;
  if(t<tin){ // deck: stacked in intro
    const p=oc(cl((t+0.6-i*0.06)/0.5));const fz=back(cl((t-1.2)/0.35));x=(i-2)*(20+30*fz)*p-40*fz;y=(i-2)*-10*p+(1-p)*900+Math.abs(i-2)*28*fz;rot=(i-2)*(7+7*fz)*p+r;sc=0.62+0.04*fz;op=p;z=5-i;
    c.querySelector('.q').style.opacity=0;c.querySelector('.tag').style.opacity=0;c.querySelector('.num').style.opacity=1;
    // when another earlier card is active, deck shifts down/back
    if(t>I[0]-0.15){const k=cl((t-(I[0]-0.15))/0.3);y+= -300*k;sc=0.62-0.12*k;op=p*(1-0.35*k)}
  }else if(t<tout){const p=back(cl((t-tin)/0.42));x=0;y=0;rot=r*(1-p)+r*0.35*p;sc=0.62+0.38*cl(p,0,1.2);op=1;z=20;
    c.querySelector('.q').style.opacity=cl((t-tin)/0.25);c.querySelector('.tag').style.opacity=cl((t-tin)/0.25);
  }else{const p=io(cl((t-tout)/0.35));x=-1100*p;y=-60*p;rot=r-14*p;sc=1;op=1;z=19;}
  c.style.transform=`translate(${x}px,${y}px) rotate(${rot}deg) scale(${sc})`;c.style.opacity=op;c.style.zIndex=z;
  const st=c.querySelector('.stamp');const ps=cl((t-D.decode[i]-0.05)/0.22);st.style.opacity=ps>0?1:0;st.style.transform=`rotate(-8deg) scale(${(1.9-0.9*oc(ps)).toFixed(3)})`;}
 dots.forEach((d,k)=>d.className='dot'+(t>=I[k]-0.15?' on':''));
 document.getElementById('dots').style.opacity=t<D.out1-0.1?1:Math.max(0,1-(t-D.out1+0.1)/0.3);
 // final card
 const fin=document.getElementById('fin');const pf=back(cl((t-D.out2+0.1)/0.45));fin.style.opacity=t>=D.out2-0.1?1:0;fin.style.transform=`translateY(${(1-pf)*700}px) rotate(${-2+2*cl(pf,0,1)}deg)`;
 {const m=document.getElementById('mid');if(!m.dataset.c){m.querySelector('.paper').style.clipPath=torn(780,560,9);m.dataset.c=1}const p1=back(cl((t-D.out1+0.05)/0.42)),p2=io(cl((t-D.out2+0.15)/0.3));m.style.opacity=(t>=D.out1-0.05)?1:0;m.style.zIndex=30;m.style.transform=`translate(${-1100*p2}px,${(1-p1)*900}px) rotate(${(2-1*cl(p1,0,1)-12*p2).toFixed(2)}deg)`;}
 // sticker windows
 const W=[[-0.4,4.0,'st_a.png'],[I[2]-0.1,I[3]-0.2,'st_c.png'],[D.out1-0.1,99,'st_a.png']];let sv=null;
 for(const w of W)if(t>=w[0]&&t<w[1])sv=w;
 if(!sv){stk.style.opacity=0}else{ if(!sti.src.endsWith(sv[2]))sti.src=sv[2];
  const pi=back(cl((t-sv[0])/0.4)),po=cl((sv[1]-t)/0.18);const e=D.env[Math.min(D.env.length-1,fr)]||0;
  const big=(sv===W[2]); const base=big?1.0:1;
  stk.style.left=(big?66:66)+'px';stk.style.top=(big||sv===W[1]?1060:520)+'px';
  stk.style.opacity=Math.min(cl(pi*3),po);stk.style.transform=`scale(${(pi*base*(1+0.05*e)).toFixed(4)}) rotate(${(-6+4*Math.sin(t*2.2)).toFixed(2)}deg)`;}
 // captions
 let ci=-1;for(let k=0;k<D.caps.length;k++){const c=D.caps[k];if(t>=c.t0&&t<c.t1)ci=k}
 if(ci!==curC){curC=ci;blk.innerHTML='';if(ci>=0){blk.style.setProperty('--fs','64px');for(const w of D.caps[ci].ws){const s=document.createElement('span');s.className='w'+(w.hl?' hl':'');s.textContent=w.w;s.dataset.s=w.s;blk.appendChild(s)}const mw=blk.getBoundingClientRect().width;if(mw>780)blk.style.setProperty('--fs',(64*780/mw).toFixed(1)+'px')}}
 for(const s of blk.children){const p=cl((t-(+s.dataset.s-0.03))/0.16);s.style.opacity=cl(p*3);const e=back(p);s.style.transform=`translateY(${((1-e)*22).toFixed(2)}px)`}
 // bbox
 let b=null;const add=el=>{const r=el.getBoundingClientRect();if(r.width<1)return;b=b?[Math.min(b[0],r.left),Math.min(b[1],r.top),Math.max(b[2],r.right),Math.max(b[3],r.bottom)]:[r.left,r.top,r.right,r.bottom]};
 for(const s of blk.children)if(+s.style.opacity>0)add(s);
 for(const el of document.querySelectorAll('#title > div'))add(el);
 return b;
};
</script></body></html>
