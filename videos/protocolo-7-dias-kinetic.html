(function(){

// critically damped step, normalized so it lands exactly at u=1
const K=7, CD1=1-(1+K)*Math.exp(-K);
function cd(t,t0,dur){const u=clamp((t-t0)/dur);if(u>=1)return 1;return (1-(1+K*u)*Math.exp(-K*u))/CD1;}
function fade(t,t0,dur){const u=clamp((t-t0)/dur);return u*u*(3-2*u);}
// critically damped impulse (rises and returns to exactly 0)
function bump(t,t0,dur){const u=clamp((t-t0)/dur);if(u<=0||u>=1)return 0;const k=6;const v=(k*u)*Math.exp(1-k*u);return v*(1-u*u*u);}
// underdamped spring, used ONLY for the baseline
function spring(t,t0,dur,freq){const u=clamp((t-t0)/dur);if(u<=0||u>=1)return 0;return Math.exp(-6*u)*Math.sin(freq*u)*(1-u);}

// ---------- text helpers ----------
function font(fam,size,w){return (w||400)+" "+size+"px "+fam;}
function mw(txt,f){ctx.font=f;return ctx.measureText(txt).width;}
function capH(txt,f){ctx.font=f;const m=ctx.measureText(txt);return m.actualBoundingBoxAscent;}
function text(txt,x,y,f,col,align){ctx.font=f;ctx.fillStyle=col;ctx.textAlign=align||"left";ctx.textBaseline="alphabetic";ctx.fillText(txt,x,y);}

// ---------- layout (computed once, after fonts) ----------
let Lay=null;
function layout(){
  const o={};
  // Scene 1: row "A CRISE chegou em" lands on the roof of CASA
  let s=96,cs=150;
  for(let i=0;i<40;i++){
    const w=mw("A",font(SERIF,s))+mw(" ",font(SERIF,s))+mw("CRISE",font(BLACK,cs))+mw(" chegou em",font(SERIF,s));
    if(w<=CW)break; s-=2;cs-=3;
  }
  o.s1={serif:s,black:cs};
  o.s1.wA=mw("A ",font(SERIF,s));o.s1.wC=mw("CRISE",font(BLACK,cs));o.s1.wRest=mw(" chegou em",font(SERIF,s));
  // CASA frame: letters fill the inner width
  const pad=26,stroke=10;
  let fs=300;
  while(mw("CASA.",font(BLACK,fs))>CW-2*pad-24&&fs>40)fs-=2;
  o.casa={fs,pad,stroke,cap:capH("CASA",font(BLACK,fs))};
  o.casa.H=o.casa.cap+2*pad+stroke;
  // Scene 2
  o.s2={serif:92,black:0};
  let pb=200;while(mw("PISAR.",font(BLACK,pb))>560)pb-=2;o.s2.black=pb;
  o.gapL=430;o.gapR=730;o.gapC=(o.gapL+o.gapR)/2;
  // Blocks
  const gap=4;o.bw=(CW-6*gap)/7;o.bh=110;o.bgap=gap;o.rise=84;
  let df=60;while(mw("DIA",font(BLACK,df))>o.bw-26)df--;o.dfs=df;
  // Logo
  let p1=200;while(mw("PROTOCOLO",font(BLACK,p1))>CW)p1--;
  let p2=320;while(mw("7 DIAS",font(BLACK,p2))>CW)p2--;
  o.logo={p1,p2,c1:capH("PROTOCOLO",font(BLACK,p1)),c2:capH("7 DIAS",font(BLACK,p2))};
  return o;
}

// ---------- block geometry ----------
const TILT=[1.5,-1.3,0.9,-1.7,1.2,-0.8,-1.4]; // degrees, fixed values (no randomness)
function blockState(t,i){
  const x=L+i*(Lay.bw+Lay.bgap);
  const arrive=4.85+i*0.33;
  const a=cd(t,arrive,0.55);
  const op=fade(t,arrive,0.18);
  // staircase position
  const stairBottom=G-i*Lay.rise;
  // levelling (Sete passos), left to right in reading order
  const lv=cd(t,7.62+i*0.05,0.75);
  const bottom=lerp(stairBottom-240,stairBottom,a)*(1-lv)+G*lv;
  const tilt=TILT[i]*(1-lv)*a;
  // load of the logo (held compression) and its release, travelling left to right
  const load=cd(t,9.75,0.45)*(1-cd(t,12.0+i*0.085,0.55));
  const wave=bump(t,12.0+i*0.085,0.7)*1.5;
  const squash=4*load-wave;
  return {x,bottom,tilt,op,h:Lay.bh-squash};
}

// ---------- scene renderers ----------
function drawGround(t){
  // ground line = floor of CASA, later the broken baseline, later the bed of the platform
  const lw=10;
  const split=cd(t,3.28,0.42);                    // opening of the gap
  const pre=fade(t,3.0,0.28)*(1-fade(t,3.28,0.06)); // sag under PISAR before the break
  const droopHold=cd(t,3.28,0.5)*(1-cd(t,7.62,0.9)); // residual droop until the platform levels it
  const elas=spring(t,3.28,0.62,16);
  const endDrop=7*droopHold+22*elas;
  ctx.save();ctx.strokeStyle=RED;ctx.lineWidth=lw;ctx.lineCap="butt";
  if(split<=0){
    ctx.beginPath();
    for(let k=0;k<=80;k++){const x=lerp(L,R,k/80);const d=Math.sin(Math.PI*(x-L)/CW);ctx.lineTo(x,G+lw/2+12*pre*d*d*d*d);}
    ctx.stroke();
  }else{
    const xl=lerp(Lay.gapC,Lay.gapL,split),xr=lerp(Lay.gapC,Lay.gapR,split);
    ctx.beginPath();
    for(let k=0;k<=60;k++){const x=lerp(L,xl,k/60);const u=(x-L)/(xl-L);ctx.lineTo(x,G+lw/2+endDrop*u*u);}
    ctx.stroke();
    ctx.beginPath();
    for(let k=0;k<=60;k++){const x=lerp(xr,R,k/60);const u=(R-x)/(R-xr);ctx.lineTo(x,G+lw/2+endDrop*u*u);}
    ctx.stroke();
  }
  ctx.restore();
}

function scene1(t){
  if(t>2.75)return;
  const c=Lay.casa;
  const out=fade(t,2.25,0.4);
  const inOp=fade(t,0.05,0.35);
  const comp=cd(t,1.12,0.8);                   // compression after contact
  const sc=lerp(1,0.66,comp)*(1-0.92*cd(t,2.28,0.42));
  const FH=c.H*sc;                              // frame height
  const roof=G-FH;
  const tiltRoof=0;
  // CASA frame
  ctx.save();ctx.globalAlpha=inOp*(1-out);
  ctx.strokeStyle=PAPER;ctx.fillStyle=PAPER;
  ctx.lineWidth=c.stroke;
  // posts
  ctx.fillRect(L,roof,c.stroke,FH);ctx.fillRect(R-c.stroke,roof,c.stroke,FH);
  // roof beam (tilts a hair under the load)
  ctx.save();ctx.translate(L+CW/2,roof+c.stroke/2);ctx.rotate(tiltRoof);ctx.fillRect(-CW/2,-c.stroke/2,CW,c.stroke);ctx.restore();
  // letters, compressed about the floor
  const innerH=G-(roof+c.stroke),ls=innerH/(c.cap+2*c.pad);
  ctx.save();ctx.translate(0,G-c.pad*ls);ctx.scale(1,ls);
  ctx.font=font(BLACK,c.fs);ctx.fillStyle=PAPER;ctx.textBaseline="alphabetic";
  const word="CASA.";const tw=mw(word,font(BLACK,c.fs));const extra=(CW-2*c.pad-tw)/4;
  let x=L+c.pad;for(const ch of word){ctx.font=font(BLACK,c.fs);ctx.fillText(ch,x,0);x+=mw(ch,font(BLACK,c.fs))+extra;}
  ctx.restore();
  ctx.restore();
  // the load row: A CRISE chegou em
  const s=Lay.s1;
  const restBase=roof-2;                        // sits on roof beam
  const drop=cd(t,0.15,0.97);
  const base=lerp(G-c.H-2-430,G-c.H-2,drop);  // descends to the uncompressed roof...
  const rowBase=t<1.12?base:restBase;           // ...then rides it down
  ctx.save();ctx.globalAlpha=fade(t,0.0,0.3)*(1-out);
  const x0=L;
  ctx.translate(L+CW/2,rowBase);ctx.rotate(tiltRoof);ctx.translate(-(L+CW/2),-rowBase);
  const sb=rowBase-24;
  text("A",x0,sb,font(SERIF,s.serif),PAPER);
  text("CRISE",x0+s.wA,rowBase,font(BLACK,s.black),PAPER);
  text(" chegou em",x0+s.wA+s.wC,sb,font(SERIF,s.serif),PAPER);
  ctx.restore();
}

function scene2(t){
  if(t<2.5||t>4.75)return;
  const out=fade(t,4.38,0.3);
  const a1=fade(t,2.55,0.35),a2=fade(t,2.78,0.35);
  const y1=G-210+(1-cd(t,2.55,0.5))*18;
  ctx.save();
  ctx.globalAlpha=a1*(1-out);
  text("Ninguém sabia",L,y1,font(SERIF,Lay.s2.serif),PAPER);
  ctx.globalAlpha=a2*(1-out);
  const onde="onde";const wo=mw(onde,font(SERIF,Lay.s2.serif));
  // PISAR centred over the gap; it dips a little when the floor gives way
  const pw=mw("PISAR.",font(BLACK,Lay.s2.black));
  const px=Math.max(L+wo+28,Math.min(R-pw,Lay.gapC-pw/2+40));
  const dip=6*fade(t,3.0,0.28)*(1-cd(t,3.3,0.5))+3*cd(t,3.3,0.5);
  const yb=G-18+(1-cd(t,2.78,0.5))*18+dip;
  text(onde,L,yb,font(SERIF,Lay.s2.serif),PAPER);
  text("PISAR.",px,yb,font(BLACK,Lay.s2.black),PAPER);
  ctx.restore();
}

function drawBlocks(t){
  if(t<4.8)return;
  for(let i=0;i<7;i++){
    const b=blockState(t,i);if(b.op<=0)continue;
    ctx.save();ctx.globalAlpha=b.op;
    const cx=b.x+Lay.bw/2;
    ctx.translate(cx,b.bottom);ctx.rotate(b.tilt*Math.PI/180);
    ctx.fillStyle=PAPER;ctx.fillRect(-Lay.bw/2,-b.h,Lay.bw,b.h);
    // DIA, set inside the block
    const sy=b.h/Lay.bh;
    ctx.save();ctx.translate(0,-16*sy);ctx.scale(1,sy);
    text("DIA",0,0,font(BLACK,Lay.dfs),BG,"center");ctx.restore();
    // day mark
    text(String(i+1),-Lay.bw/2+12,-b.h+30,font(MONO,26,500),BG,"left");
    ctx.restore();
  }
}

function scene3text(t){
  if(t<4.5||t>7.9)return;
  const out=fade(t,7.4,0.3);
  ctx.save();
  ctx.globalAlpha=fade(t,4.55,0.35)*(1-out);
  text("Um dia.",L,G+170+(1-cd(t,4.55,0.5))*16,font(SERIF,96),PAPER);
  ctx.globalAlpha=fade(t,5.25,0.35)*(1-out);
  text("Depois outro.",L,G+285+(1-cd(t,5.25,0.5))*16,font(SERIF,96),PAPER);
  ctx.restore();
}

function scene4text(t){
  if(t<7.5||t>9.4)return;
  const out=fade(t,8.95,0.3);
  ctx.save();ctx.globalAlpha=fade(t,7.6,0.35)*(1-out);
  text("Sete passos.",L,G+200+(1-cd(t,7.6,0.5))*16,font(SERIF,104),PAPER);
  ctx.restore();
}

function avgTop(t){let s=0;for(let i=0;i<7;i++){const b=blockState(t,i);s+=b.bottom-b.h;}return s/7;}

function logo(t){
  if(t<9.0)return;
  const lg=Lay.logo;
  const land=cd(t,9.1,0.75);
  const top=avgTop(t);                          // the logo stands on the platform
  const gap1=34;
  const base2=top-24 - (1-land)*140;
  const base1=base2-lg.c2-gap1;
  ctx.save();ctx.globalAlpha=fade(t,9.1,0.3);
  text("PROTOCOLO",L+CW/2,base1,font(BLACK,lg.p1),PAPER,"center");
  // 7 DIAS, the 7 in red
  const w7=mw("7",font(BLACK,lg.p2)),wAll=mw("7 DIAS",font(BLACK,lg.p2));
  const x0=L+(CW-wAll)/2;
  text("7",x0,base2,font(BLACK,lg.p2),RED,"left");
  text(" DIAS",x0+w7,base2,font(BLACK,lg.p2),PAPER,"left");
  ctx.restore();
  // slogan
  const sa=fade(t,10.25,0.45),sy=(1-cd(t,10.25,0.6))*14;
  ctx.save();ctx.globalAlpha=sa;
  text("O que fazer quando a crise",L,G+120+sy,font(SERIF,62),PAPER);
  text("chega em casa.",L,G+200+sy,font(SERIF,62),PAPER);
  ctx.restore();
  // signature
  ctx.save();ctx.globalAlpha=fade(t,11.6,0.45);
  ctx.font=font(MONO,34,500);ctx.fillStyle=PAPER;ctx.textAlign="left";
  if("letterSpacing" in ctx)ctx.letterSpacing="2px";
  ctx.fillText("Dr. Fabio Schmidt",L,G+340);
  if("letterSpacing" in ctx)ctx.letterSpacing="0px";
  ctx.restore();
}

// ---------- frame ----------
function render(t){
  t=clamp(t,0,DUR);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha=1;ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
  drawGround(t);
  scene1(t);
  scene2(t);
  scene3text(t);
  scene4text(t);
  drawBlocks(t);
  logo(t);
}

// ---------- public API ----------
let fontsReady=false;
const ready=Promise.all([
  document.fonts.load(font(SERIF,96,400)),document.fonts.load(font(SERIF,96,600)),
  document.fonts.load(font(BLACK,96)),document.fonts.load(font(MONO,22,400)),document.fonts.load(font(MONO,22,500))
]).then(()=>document.fonts.ready).then(()=>{Lay=layout();fontsReady=true;render(0);});
window.ready=ready;
window.seek=function(t){if(!fontsReady)return ready.then(()=>render(t));render(t);};
window.seekFrame=function(n){return window.seek(n/FPS);};
window.FRAMES=FRAMES;window.FPS=FPS;window.DURATION=DUR;

// ---------- preview controls (not part of the render) ----------
if(/[?&]render=1/.test(location.search))document.body.classList.add("render");
const pp=document.getElementById("pp"),sc=document.getElementById("scrub"),tc=document.getElementById("tc");
let playing=false,startWall=0,startT=0,cur=0;
function show(t){cur=t;const f=Math.min(FRAMES-1,Math.round(t*FPS));sc.value=f;tc.textContent=t.toFixed(2)+"s / f"+f;window.seek(t);}
function loop(now){if(!playing)return;const t=startT+(now-startWall)/1000;if(t>=DUR-1/FPS){playing=false;pp.textContent="Play";show((FRAMES-1)/FPS);return;}show(Math.floor(t*FPS)/FPS);requestAnimationFrame(loop);}
pp.onclick=()=>{if(playing){playing=false;pp.textContent="Play";return;}if(cur>=DUR-2/FPS)cur=0;playing=true;pp.textContent="Pause";startWall=performance.now();startT=cur;requestAnimationFrame(loop);};
sc.oninput=()=>{playing=false;pp.textContent="Play";show(sc.value/FPS);};
ready.then(()=>show(0));
})();
</script>
</body>
