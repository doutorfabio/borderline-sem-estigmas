<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:M;src:url(fonts/mont800.ttf);font-weight:800}
@font-face{font-family:F;src:url(fonts/fraunces900i.ttf);font-style:italic;font-weight:900}
html,body{margin:0;padding:0;background:#000;width:1080px;height:1920px;overflow:hidden}
#stage{position:absolute;inset:0;overflow:hidden;background:#0b0b0d}
.layer{position:absolute;overflow:hidden}
.layer img{position:absolute;display:block}
#bg{inset:0;opacity:0}
#bg img{width:1080px;height:1920px;left:0;top:0;filter:blur(46px) saturate(.75) brightness(.42);transform-origin:50% 50%}
#vign{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 35%,rgba(0,0,0,.55) 100%)}
#top{left:0;top:0;width:1080px;height:945px}
#top img{left:0;top:0;width:1080px;height:1920px}
#bot{will-change:transform}
#bot img{width:1080px;height:1920px}
#ring{position:absolute;pointer-events:none;opacity:0;box-sizing:border-box;border:1.5px solid rgba(255,255,255,.34)}
#accent{position:absolute;height:4px;width:56px;background:#EE2A22;border-radius:2px;opacity:0}
#cap{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
.w{position:absolute;left:0;top:0;white-space:nowrap;line-height:1;will-change:transform,opacity}
.n{font-family:M;font-weight:800;color:#fff;letter-spacing:1px;
   -webkit-text-stroke:2px rgba(0,0,0,.55);paint-order:stroke fill;
   text-shadow:0 4px 14px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.5)}
.h{font-family:F;font-style:italic;font-weight:900;color:#EE2A22;letter-spacing:.5px;
   text-shadow:0 4px 16px rgba(0,0,0,.6),0 1px 3px rgba(0,0,0,.55)}
</style></head>
<body><div id="stage">
  <div id="bg" class="layer"><img id="ibg"></div>
  <div id="vign"></div>
  <div id="top" class="layer"><img id="itop"></div>
  <div id="bot" class="layer"><img id="ibot"></div>
  <div id="ring"></div>
  <div id="accent"></div>
  <div id="cap"></div>
</div>
<script>
const BASE=82, HS=1.55, MAXW=780, CX=530, GAP=0.30; // em gap between words
const SPLIT=945, HER_Y=975, HER_H=945;
// solo window (her alone, centred) in seconds
const SOLO_IN=3.62, SOLO_OUT=9.66, TR=0.5;
const CARD_W=900, CARD_H=Math.round(900*HER_H/1080), CARD_CY=820, RAD=30;
let BLOCKS=[];
const ease=x=>x<=0?0:x>=1?1:1-Math.pow(1-x,3);
const eio=x=>x<=0?0:x>=1?1:(x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2);
const back=x=>{if(x<=0)return 0;if(x>=1)return 1;const c1=1.4,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,p)=>a+(b-a)*p;
const cv=document.createElement('canvas').getContext('2d');
const clean=s=>s.replace(/[.,]+$/,'');
function meas(w,size){cv.font=(w.h?`italic 900 ${size*HS}px F`:`800 ${size}px M`);return cv.measureText(w.txt).width+(w.h?size*HS*0.5/70:0)+ (w.h?0:(w.txt.length-1)*1)}
function soloP(t){ // 0 split, 1 solo
  if(t<SOLO_IN||t>SOLO_OUT+TR) return 0;
  if(t<SOLO_IN+TR) return eio((t-SOLO_IN)/TR);
  if(t<SOLO_OUT) return 1;
  return 1-eio((t-SOLO_OUT)/TR);
}
async function init(){
  BLOCKS=[[[{"t": "O", "s": 0.0, "e": 0.12, "h": false}, {"t": "PESSOAL", "s": 0.12, "e": 0.42, "h": false}, {"t": "ESTAVA", "s": 0.42, "e": 0.6, "h": false}]], [[{"t": "PERGUNTANDO", "s": 0.6, "e": 1.08, "h": false}, {"t": "AQUI", "s": 1.08, "e": 1.44, "h": false}]], [[{"t": "SE", "s": 1.44, "e": 1.84, "h": false}, {"t": "PODE", "s": 1.84, "e": 2.08, "h": false}, {"t": "TER", "s": 2.08, "e": 2.28, "h": false}]], [[{"t": "TDAH", "s": 2.28, "e": 2.82, "h": true}], [{"t": "E", "s": 2.82, "e": 3.0, "h": false}, {"t": "BORDERLINE", "s": 3.0, "e": 3.6, "h": false}]], [[{"t": "OH,", "s": 3.76, "e": 3.92, "h": false}, {"t": "GENTE,", "s": 4.12, "e": 4.44, "h": false}]], [[{"t": "CLARO", "s": 4.86, "e": 5.14, "h": false}, {"t": "QUE", "s": 5.14, "e": 5.44, "h": false}], [{"t": "PODE", "s": 5.44, "e": 5.9, "h": true}]], [[{"t": "E", "s": 6.62, "e": 7.06, "h": false}, {"t": "AÍ,", "s": 7.06, "e": 7.26, "h": false}]], [[{"t": "DOUTOR", "s": 7.38, "e": 7.94, "h": false}, {"t": "FÁBIO,", "s": 7.94, "e": 8.32, "h": false}]], [[{"t": "O", "s": 8.38, "e": 8.46, "h": false}, {"t": "QUE", "s": 8.46, "e": 8.52, "h": false}, {"t": "PODE", "s": 8.52, "e": 8.68, "h": false}]], [[{"t": "TER", "s": 8.68, "e": 9.0, "h": false}, {"t": "COM", "s": 9.0, "e": 9.14, "h": false}, {"t": "BORDERLINE?", "s": 9.14, "e": 9.62, "h": false}]], [[{"t": "OLHA,", "s": 9.88, "e": 10.12, "h": false}]], [[{"t": "JUNTO", "s": 10.24, "e": 10.82, "h": false}, {"t": "COM", "s": 10.82, "e": 11.02, "h": false}, {"t": "BORDERLINE", "s": 11.02, "e": 11.48, "h": false}]], [[{"t": "DE", "s": 11.48, "e": 11.66, "h": false}, {"t": "COMORBIDADE,", "s": 11.66, "e": 12.04, "h": true}]], [[{"t": "TEM", "s": 12.12, "e": 12.44, "h": false}, {"t": "MUITA", "s": 12.44, "e": 12.76, "h": false}, {"t": "COISA,", "s": 12.76, "e": 13.1, "h": false}]], [[{"t": "MUITA", "s": 13.22, "e": 13.36, "h": false}, {"t": "COISA", "s": 13.36, "e": 13.72, "h": false}]], [[{"t": "NA", "s": 13.92, "e": 14.14, "h": false}, {"t": "REALIDADE,", "s": 14.14, "e": 14.4, "h": false}]], [[{"t": "O", "s": 14.42, "e": 14.52, "h": false}, {"t": "BORDERLINE", "s": 14.52, "e": 14.86, "h": false}]], [[{"t": "É", "s": 14.86, "e": 14.94, "h": false}, {"t": "UM", "s": 14.94, "e": 15.0, "h": false}, {"t": "TRANSTORNO", "s": 15.0, "e": 15.22, "h": false}]], [[{"t": "DE", "s": 15.22, "e": 15.34, "h": false}, {"t": "PERSONALIDADE,", "s": 15.34, "e": 16.12, "h": true}]], [[{"t": "ENTÃO,", "s": 16.28, "e": 16.58, "h": false}, {"t": "É", "s": 16.58, "e": 16.7, "h": false}, {"t": "POSSÍVEL", "s": 16.7, "e": 17.08, "h": false}]], [[{"t": "TER", "s": 17.08, "e": 17.38, "h": false}, {"t": "O", "s": 17.38, "e": 17.5, "h": false}, {"t": "TRANSTORNO", "s": 17.5, "e": 17.76, "h": false}]], [[{"t": "DE", "s": 17.76, "e": 17.88, "h": false}, {"t": "PERSONALIDADE", "s": 17.88, "e": 18.38, "h": false}]], [[{"t": "E", "s": 18.38, "e": 18.58, "h": false}, {"t": "O", "s": 18.58, "e": 18.6, "h": false}, {"t": "TRANSTORNO", "s": 18.6, "e": 18.94, "h": false}]], [[{"t": "DE", "s": 18.94, "e": 19.12, "h": false}, {"t": "HUMOR,", "s": 19.12, "e": 19.24, "h": false}]], [[{"t": "POR", "s": 19.44, "e": 19.66, "h": false}, {"t": "EXEMPLO,", "s": 19.66, "e": 19.96, "h": false}]], [[{"t": "COM", "s": 20.06, "e": 20.46, "h": false}, {"t": "BIPOLARIDADE", "s": 20.46, "e": 21.18, "h": true}]], [[{"t": "É", "s": 21.36, "e": 21.46, "h": false}, {"t": "POSSÍVEL", "s": 21.46, "e": 21.72, "h": false}, {"t": "TER", "s": 21.72, "e": 21.98, "h": false}]], [[{"t": "TAMBÉM", "s": 21.98, "e": 22.26, "h": false}, {"t": "UM", "s": 22.26, "e": 22.44, "h": false}, {"t": "DISTÚRBIO", "s": 22.44, "e": 22.72, "h": false}]], [[{"t": "COGNITIVO,", "s": 22.72, "e": 23.52, "h": false}]], [[{"t": "QUE", "s": 23.52, "e": 23.64, "h": false}, {"t": "É", "s": 23.64, "e": 23.74, "h": false}, {"t": "DE", "s": 23.74, "e": 23.82, "h": false}]], [[{"t": "NEURODESENVOLVIMENTO,", "s": 23.82, "e": 25.34, "h": true}]], [[{"t": "COMO", "s": 25.38, "e": 25.74, "h": false}, {"t": "O", "s": 25.74, "e": 26.08, "h": false}, {"t": "TDAH", "s": 26.08, "e": 26.48, "h": true}]], [[{"t": "OU", "s": 26.48, "e": 26.68, "h": false}, {"t": "O", "s": 26.68, "e": 26.76, "h": false}, {"t": "TRANSTORNO", "s": 26.76, "e": 26.94, "h": false}]], [[{"t": "DE", "s": 26.94, "e": 27.04, "h": false}, {"t": "ESPECTRO", "s": 27.04, "e": 27.3, "h": false}], [{"t": "AUTISTA", "s": 27.3, "e": 27.68, "h": true}]], [[{"t": "ENTÃO,", "s": 27.68, "e": 27.94, "h": false}, {"t": "SÃO", "s": 28.06, "e": 28.4, "h": false}]], [[{"t": "ENTIDADES", "s": 28.4, "e": 29.62, "h": false}], [{"t": "DIFERENTES,", "s": 29.62, "e": 29.9, "h": false}]], [[{"t": "MAS", "s": 30.08, "e": 30.22, "h": false}, {"t": "PODEM", "s": 30.22, "e": 30.48, "h": false}], [{"t": "COEXISTIR,", "s": 30.48, "e": 31.1, "h": true}]], [[{"t": "SIM,", "s": 31.12, "e": 31.26, "h": false}, {"t": "COM", "s": 31.26, "e": 31.48, "h": false}, {"t": "CERTEZA", "s": 31.48, "e": 31.78, "h": false}]]];
  await document.fonts.load('800 70px M');await document.fonts.load('italic 900 70px F');
  const cap=document.getElementById('cap');
  BLOCKS.forEach((b,bi)=>{
    b.start=b[0][0].s; b.end=bi+1<BLOCKS.length?BLOCKS[bi+1][0][0].s:99;
    b.forEach(l=>l.forEach(w=>{w.txt=clean(w.t);const el=document.createElement('div');el.className='w '+(w.h?'h':'n');el.textContent=w.txt;el.style.opacity=0;cap.appendChild(el);w.el=el;}));
    // fit size
    let size=BASE;
    b.forEach(l=>l.forEach(w=>{w.el.style.fontSize=(w.h?BASE*HS:BASE)+'px'}));
    for(const l of b){let wd=l.reduce((a,w)=>a+w.el.getBoundingClientRect().width,0)+(l.length-1)*BASE*GAP; if(wd>MAXW) size=Math.min(size,BASE*MAXW/wd);}
    b.size=size;
    b.forEach(l=>l.forEach(w=>{w.el.style.fontSize=(w.h?size*HS:size)+'px';w.wd=w.el.getBoundingClientRect().width}));
  });
  window.READY=true;
}
function lineH(l,size){return l.some(w=>w.h)?size*HS*1.02:size*1.08}
// layout for set of visible words: returns map word->{x,y}
function layout(b,vis,cy,p){
  const lines=b.map(l=>l.filter(w=>vis.has(w))).filter(l=>l.length);
  const hs=lines.map(l=>lineH(l,b.size));const tot=hs.reduce((a,c)=>a+c,0)+(lines.length-1)*b.size*0.12;
  let y=lerp(960-tot/2,cy,p||0);const pos=new Map();
  lines.forEach((l,i)=>{
    const wd=l.reduce((a,w)=>a+w.wd,0)+(l.length-1)*b.size*GAP;let x=CX-wd/2;
    l.forEach(w=>{pos.set(w,{x,y:y+hs[i]/2});x+=w.wd+b.size*GAP});
    y+=hs[i]+b.size*0.12;
  });
  return pos;
}
function setT(t){
  const p=soloP(t);
  // ---- video layers
  document.getElementById('bg').style.opacity=p;
  document.getElementById('vign').style.opacity=p;
  const bgi=document.getElementById('ibg');
  // background: her half scaled to cover full frame
  const sc=1920/HER_H; bgi.style.transform=`translate(${-(1080*sc-1080)/2}px,${-HER_Y*sc}px) scale(${sc})`;bgi.style.transformOrigin='0 0';
  const top=document.getElementById('top');
  top.style.opacity=1-p; top.style.transform=`translateY(${-60*p}px) scale(${1-0.04*p})`;
  // her card rect interpolation
  const x0=0,y0=HER_Y,w0=1080,h0=HER_H;
  const w1=CARD_W,h1=CARD_H,x1=(1080-w1)/2,y1=CARD_CY-h1/2;
  const x=lerp(x0,x1,p),y=lerp(y0,y1,p),w=lerp(w0,w1,p),h=lerp(h0,h1,p);
  const bot=document.getElementById('bot');
  Object.assign(bot.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',borderRadius:(RAD*p)+'px',
    boxShadow:`0 ${30*p}px ${90*p}px rgba(0,0,0,${0.6*p})`});
  const s=w/1080; const ib=document.getElementById('ibot');
  ib.style.width=1080*s+'px';ib.style.height=1920*s+'px';ib.style.left='0px';ib.style.top=(-HER_Y*s)+'px';
  const ring=document.getElementById('ring');
  Object.assign(ring.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',borderRadius:(RAD*p)+'px',opacity:p});
  const ac=document.getElementById('accent');
  Object.assign(ac.style,{left:(540-28)+'px',top:(y+h+26)+'px',opacity:p,transform:`scaleX(${p})`});
  // ---- captions
  const cy=y1+h1+64;
  for(const b of BLOCKS){
    const act=t>=b.start-0.001&&t<b.end;
    const ws=b.flat();
    if(!act){ws.forEach(w=>w.el.style.opacity=0);continue}
    const vis=new Set(b===BLOCKS[0]?ws:ws.filter(w=>t>=w.s-0.03));
    if(!vis.size) vis.add(ws[0]);
    // latest word & its progress for re-layout slide
    const order=ws.filter(w=>vis.has(w));const last=order[order.length-1];
    const lp=b===BLOCKS[0]?1:ease((t-(last.s-0.03))/0.20);
    const prevVis=new Set(order.slice(0,-1));
    const P1=layout(b,vis,cy,p), P0=prevVis.size?layout(b,prevVis,cy,p):P1;
    for(const w of ws){
      if(!vis.has(w)){w.el.style.opacity=0;continue}
      const a=P1.get(w), z=P0.get(w)||a;
      let px=lerp(z.x,a.x,lp), py=lerp(z.y,a.y,lp);
      if(w===last&&prevVis.size){const ln=b.find(l=>l.includes(w));const k2=ln.indexOf(w);if(k2>0){const pw=ln[k2-1];px=pw._px+pw.wd+b.size*GAP;}}
      w._px=px;
      const k=Math.max(0,Math.min(1,(t-(w.s-0.03))/(w.h?0.26:0.17)));
      let op,dy,scl,blur;
      if(w.h){const e=back(k);op=ease(k*1.6);scl=lerp(b.size<BASE*0.95?1.08:1.28,1,e);dy=0;blur=(1-ease(k))*5}
      else{const e=ease(k);op=e;scl=lerp(0.92,1,e);dy=lerp(b.size*0.32,0,e);blur=(1-e)*4}
      if(b===BLOCKS[0]){op=1;scl=1;dy=0;blur=0}
      const fh=(w.h?b.size*HS:b.size);{const c=px+w.wd/2,hw=w.wd/2;scl=Math.min(scl,(940-c)/hw,(c-64)/hw)}
      w.el.style.opacity=op*(1-0.92*Math.sin(Math.PI*p));
      w.el.style.filter=blur>0.2?`blur(${blur}px)`:'none';
      w.el.style.transformOrigin='50% 60%';
      w.el.style.transform=`translate(${px}px,${py-fh*0.5+dy}px) scale(${scl})`;
    }
  }
}
init();
async function frame(i,t){const ims=['ibg','itop','ibot'].map(id=>document.getElementById(id));const src='frames/'+String(i).padStart(4,'0')+'.jpg';await Promise.all(ims.map(im=>{if(im.getAttribute('src')===src)return;im.src=src;return im.decode()}));setT(t);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));}
