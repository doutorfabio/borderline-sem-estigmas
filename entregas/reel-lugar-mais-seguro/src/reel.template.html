<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lugar mais seguro · Reel 35 s</title>
<style>
@font-face{font-family:'Anton';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,__FONT_ANTON__) format('woff2');}
@font-face{font-family:'Fraunces';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,__FONT_FRAUNCES_400__) format('woff2');}
@font-face{font-family:'Bodoni Moda';font-weight:900;font-style:italic;src:url(data:font/woff2;base64,__FONT_KEY__) format('woff2');}
@font-face{font-family:'Courier Prime';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,__FONT_COURIER_400__) format('woff2');}
@font-face{font-family:'Courier Prime';font-weight:700;font-style:normal;src:url(data:font/woff2;base64,__FONT_COURIER_700__) format('woff2');}
html,body{margin:0;height:100%;background:#1A1A1A;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#stage{display:block;height:calc(100vh - 14px);max-width:100vw;aspect-ratio:9/16;background:#EFE5D0;cursor:pointer}
#bar{width:min(100vw,calc((100vh - 14px)*9/16));height:6px;margin-top:4px;background:#3a3a3a;cursor:pointer}
#fill{height:100%;width:0;background:#8B1E1A}
body.render #wrap{position:static;display:block}
body.render #stage{height:1920px;width:1080px;max-width:none}
body.render #bar{display:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="stage" width="1080" height="1920"></canvas><div id="bar"><div id="fill"></div></div></div>
<script>
'use strict';
/* Reel "Lugar mais seguro" · 1080x1920 · 30 fps · 35.00 s
   Every visual is a pure function of time: drawScene(ctx, t). No timers, no state between frames. */
const W=1080,H=1920,FPS=30,DUR=35,NF=FPS*DUR,SUB=4,SHUTTER=0.36;
const PAPER='#EFE5D0',INK='#1A1A1A',RED='#8B1E1A';
const SAFE={x0:0.07*W,x1:0.88*W,y0:0.14*H,y1:0.78*H};
const CX=(SAFE.x0+SAFE.x1)/2;            // centre of the text-safe area
const AR=2688/1520;                      // every engraving has this height/width
const TAU=Math.PI*2;
const ASSETS=__ASSETS_JSON__;

// ---------- maths
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eo3=x=>1-Math.pow(1-x,3), ei3=x=>x*x*x, ei2=x=>x*x;
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const smooth=x=>x*x*(3-2*x);
// closed-form step response of a damped spring (f in Hz, z = damping ratio)
function spring(t,f=3.6,z=0.68){
  if(t<=0)return 0; if(t>1.4)return 1;
  const w=TAU*f; let v;
  if(z>=1){v=1-Math.exp(-w*t)*(1+w*t);}
  else{const wd=w*Math.sqrt(1-z*z); v=1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t));}
  return (t>0.5&&Math.abs(1-v)<0.0015)?1:v;
}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ---------- canvases
const stage=document.getElementById('stage'), acc=stage.getContext('2d');
const subC=document.createElement('canvas'); subC.width=W; subC.height=H; const sub=subC.getContext('2d',{willReadFrequently:false});
const paperC=document.createElement('canvas'); paperC.width=W; paperC.height=H;
const mC=document.createElement('canvas'); const mX=mC.getContext('2d',{willReadFrequently:true});
const IMG={}, SDFI={};
let LAYER='all';                          // 'text' draws only type (used to measure the safe area)

function makePaper(){
  const x=paperC.getContext('2d'); x.fillStyle=PAPER; x.fillRect(0,0,W,H);
  const d=x.getImageData(0,0,W,H), p=d.data, r=rng(20261118);
  for(let i=0;i<p.length;i+=4){const n=(r()+r()-1)*5.5; p[i]+=n; p[i+1]+=n; p[i+2]+=n;}
  x.putImageData(d,0,0);
}
async function loadImage(src){const im=new Image(); im.src=src; await im.decode(); return im;}
// ink coverage map (+ optional red map) -> RGBA layer: ink or brick red, alpha = coverage
async function inkLayer(aSrc,sSrc){
  const a=await loadImage(aSrc), c=document.createElement('canvas'); c.width=a.naturalWidth; c.height=a.naturalHeight;
  const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(a,0,0);
  const d=x.getImageData(0,0,c.width,c.height), p=d.data; let sd=null;
  if(sSrc){const s=await loadImage(sSrc), c2=document.createElement('canvas'); c2.width=c.width; c2.height=c.height;
    const x2=c2.getContext('2d',{willReadFrequently:true}); x2.drawImage(s,0,0,c.width,c.height); sd=x2.getImageData(0,0,c.width,c.height).data;}
  for(let i=0;i<p.length;i+=4){const al=p[i], k=sd?sd[i]/255:0; p[i]=26+113*k; p[i+1]=26+4*k; p[i+2]=26; p[i+3]=al;}
  x.putImageData(d,0,0); return c;
}
// ---------- signed distance fields (exact EDT, anti-aliased edges) for perfect morphs
const INF=1e20;
function edt1d(g,off,stride,n,f,v,z){
  v[0]=0; z[0]=-INF; z[1]=INF; f[0]=g[off];
  for(let q=1,k=0,s=0;q<n;q++){
    f[q]=g[off+q*stride]; const q2=q*q;
    do{const r=v[k]; s=(f[q]-f[r]+q2-r*r)/(q-r)/2;}while(s<=z[k]&&--k>-1);
    k++; v[k]=q; z[k]=s; z[k+1]=INF;
  }
  for(let q=0,k=0;q<n;q++){while(z[k+1]<q)k++; const r=v[k], d=q-r; g[off+q*stride]=f[r]+d*d;}
}
function sdfFromAlpha(al,w,h,R){
  const n=w*h, go=new Float64Array(n), gi=new Float64Array(n), m=Math.max(w,h);
  const f=new Float64Array(m), v=new Uint16Array(m), z=new Float64Array(m+1);
  for(let i=0;i<n;i++){const a=al[i];
    if(a<=0){go[i]=INF;gi[i]=0;} else if(a>=1){go[i]=0;gi[i]=INF;}
    else{const d=0.5-a; go[i]=d>0?d*d:0; gi[i]=d<0?d*d:0;}}
  for(const g of [go,gi]){for(let x=0;x<w;x++)edt1d(g,x,w,h,f,v,z); for(let y=0;y<h;y++)edt1d(g,y*w,1,w,f,v,z);}
  const out=new Float32Array(n);
  for(let i=0;i<n;i++)out[i]=clamp(Math.sqrt(gi[i])-Math.sqrt(go[i]),-R,R*0.34);   // positive inside
  return out;
}

// ---------- type
let capA=0.7,capK=0.7,KS=1;
const fAnton=s=>`400 ${s}px Anton`, fKey=s=>`italic 900 ${s}px "Bodoni Moda"`, fSup=s=>`400 ${s}px Fraunces`;
const fCP=s=>`400 ${s}px "Courier Prime"`, fCPB=s=>`700 ${s}px "Courier Prime"`;
function measureSegs(segs,size,color){
  let x=0; const out=[];
  for(const raw of segs){
    const key=raw[0]==='*', t=key?raw.slice(1):raw, fs=key?size*KS:size;
    const font=key?fKey(fs):fAnton(fs), ls=key?0:size*0.012;
    mX.font=font; mX.letterSpacing=ls+'px';
    const w=mX.measureText(t).width-(ls);
    out.push({t,font,ls,key,color:key?RED:color,x,w}); x+=w+(key?size*0.03:0);
  }
  const last=out[out.length-1]; const w=last.x+last.w;
  return {segs:out,w};
}
function mkBlock(o){
  const color=o.color||INK, gapK=o.gap??0.2;
  const fit=base=>{let y=o.top,mw=0; const ls=[];
    for(const l of o.lines){const size=base*(l.k||1), m=measureSegs(l.segs,size,color), cap=capA*size;
      if(ls.length&&/[ÁÉÍÓÚÂÊÔÃÕÀ]/.test(l.segs.join('')))y+=size*0.13;
      y+=cap;
      ls.push({segs:m.segs,w:m.w,size,cap,by:y,cx:o.cx}); y+=base*gapK; mw=Math.max(mw,m.w);}
    return {ls,mw,h:y-base*gapK-o.top};};
  let lo=16,hi=o.maxSize||190;
  for(let i=0;i<26;i++){const mid=(lo+hi)/2, r=fit(mid); if(r.mw<=o.maxW&&r.h<=o.maxH)lo=mid; else hi=mid;}
  const base=Math.floor(lo), r=fit(base);
  return {lines:r.ls,base,h:r.h,top:o.top,bottom:o.top+r.h,cx:o.cx};
}
// st: {dy,a,sc}; which: undefined | 'ink' | 'red' ; keySt: separate state for the key word
function drawLine(ctx,L,st,keySt,which,cx,by){
  cx=cx??L.cx; by=by??L.by;
  for(const s of L.segs){
    if(which==='ink'&&s.color!==INK)continue; if(which==='red'&&s.color!==RED)continue;
    const q=(s.key&&keySt!==undefined)?keySt:st; if(!q||q.a<=0.001)continue;
    ctx.save(); ctx.globalAlpha=clamp(q.a); ctx.font=s.font; ctx.letterSpacing=s.ls+'px'; ctx.fillStyle=s.color; ctx.textBaseline='alphabetic';
    const sx=cx-L.w/2+s.x;
    if(q.sc&&q.sc!==1){
      const solo=s.key&&keySt!==undefined, px=solo?sx+s.w/2:cx, py=by-L.cap/2+(q.dy||0), hw=(solo?s.w:L.w)/2+6;
      // a scale-in may never push type past the safe area
      const sc=Math.min(q.sc,(px-SAFE.x0)/hw,(SAFE.x1-px)/hw);
      ctx.translate(px,py); ctx.scale(sc,sc); ctx.translate(-px,-py);
    }
    ctx.fillText(s.t,sx,by+(q.dy||0)); ctx.restore();
  }
}
const ON={dy:0,a:1,sc:1};
function land(t,t0,dy=46){const u=t-t0; if(u<=0)return null; const s=spring(u,3.7,0.7); return {dy:(1-s)*dy,a:clamp(u/0.09),sc:1};}
function pop(t,t0){const u=t-t0; if(u<=0)return null; const s=spring(u,4.4,0.56); return {dy:0,a:clamp(u/0.06),sc:1+(1-s)*0.26};}
function fadeIn(t,t0,d=0.35,dy=14){const p=prog(t,t0,t0+d); if(p<=0)return null; return {dy:(1-eo3(p))*dy,a:smooth(p),sc:1};}
function out(st,t,t0,d=0.22){if(!st)return null; const p=prog(t,t0,t0+d); if(p>=1)return null; if(p<=0)return st; return {dy:st.dy,a:st.a*(1-smooth(p)),sc:(st.sc||1)*(1-0.035*p)};}

let MBIAS=0.27;
// line morph: two rasters -> two distance fields -> one interpolated outline
function mkMorph(A,B){
  const pad=34, size=Math.max(A.size,B.size), w=Math.ceil(Math.max(A.w,B.w))+pad*2, asc=Math.ceil(size*1.02), h=asc+Math.ceil(size*0.3)+pad*2, baseY=pad+asc, R=Math.max(14,size*0.2);
  const ras=(L,which)=>{mC.width=w; mC.height=h; mX.clearRect(0,0,w,h); drawLine(mX,L,ON,undefined,which,w/2,baseY);
    const d=mX.getImageData(0,0,w,h).data, al=new Float32Array(w*h); let any=false;
    for(let i=0;i<al.length;i++){al[i]=d[i*4+3]/255; if(al[i]>0)any=true;} return any?al:null;};
  const layers=[];
  for(const [which,rgb] of [['ink',[26,26,26]],['red',[139,30,26]]]){
    const a=ras(A,which), b=ras(B,which); if(!a&&!b)continue;
    const empty=()=>new Float32Array(w*h).fill(-R);
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    layers.push({a:a?sdfFromAlpha(a,w,h,R):empty(), b:b?sdfFromAlpha(b,w,h,R):empty(), solo:!a||!b, rgb, c, x:c.getContext('2d'), id:new ImageData(w,h)});
  }
  return {A,B,w,h,baseY,layers,R};
}
function drawMorph(ctx,M,p){
  const cx=lerp(M.A.cx,M.B.cx,p), by=lerp(M.A.by,M.B.by,p), q=1-p, bias=M.R*MBIAS*Math.sin(Math.PI*p)+0.5;
  for(const Ly of M.layers){
    const d=Ly.id.data, a=Ly.a, b=Ly.b, [r,g,bl]=Ly.rgb;
    for(let i=0,j=0;i<a.length;i++,j+=4){
      const v=(a[i]*q+b[i]*p)+(Ly.solo?0.5:bias);
      if(v<=0){d[j+3]=0;continue;}
      d[j]=r; d[j+1]=g; d[j+2]=bl; d[j+3]=v>=1?255:v*255;
    }
    Ly.x.putImageData(Ly.id,0,0);
    ctx.drawImage(Ly.c,cx-M.w/2,by-M.baseY);
  }
}

// ---------- red paint
function resample(pts,step=1.6){
  const xs=[pts[0][0]], ys=[pts[0][1]]; let carry=0;
  for(let i=1;i<pts.length;i++){
    const dx=pts[i][0]-pts[i-1][0], dy=pts[i][1]-pts[i-1][1], d=Math.hypot(dx,dy); let s=step-carry;
    while(s<=d){xs.push(pts[i-1][0]+dx*s/d); ys.push(pts[i-1][1]+dy*s/d); s+=step;}
    carry=d-(s-step);
  }
  return {xs,ys,n:xs.length};
}
function catmull(P,seg=24){
  const o=[]; const g=i=>P[clamp(i,0,P.length-1)];
  for(let i=0;i<P.length-1;i++){const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
    for(let k=0;k<seg;k++){const t=k/seg,t2=t*t,t3=t2*t;
      o.push([0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
              0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)]);}}
  o.push(P[P.length-1]); return o;
}
// hand-drawn ellipse: wobbles, drifts outwards and overlaps its own start
function ellipsePts(cx,cy,rx,ry,rot,start,turns=1.07,seed=1){
  const o=[], n=220, c=Math.cos(rot), s=Math.sin(rot);
  for(let i=0;i<=n;i++){const u=i/n, a=start+u*turns*TAU, k=0.975+0.05*u+0.018*Math.sin(a*2+seed)+0.01*Math.sin(a*3.3+seed*2.1);
    const x=Math.cos(a)*rx*k, y=Math.sin(a)*ry*k; o.push([cx+x*c-y*s, cy+x*s+y*c]);}
  return o;
}
const wTaper=u=>0.34+0.66*Math.pow(Math.sin(Math.PI*clamp(0.04+u*0.92)),0.5);
const wLine=u=>(0.45+0.55*Math.pow(Math.sin(Math.PI*clamp(0.06+u*0.5)),0.6))*(1-0.3*u);
function brush(ctx,pts,u0,u1,width,wf=wTaper,color=RED,alpha=1){
  if(u1<=u0||alpha<=0)return; const P=resample(pts), n=P.n;
  const i0=Math.floor(u0*(n-1)), i1=Math.floor(u1*(n-1));
  ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle=color; ctx.beginPath();
  for(let i=i0;i<=i1;i++){const r=Math.max(0.6,width*wf(i/(n-1))/2); ctx.moveTo(P.xs[i]+r,P.ys[i]); ctx.arc(P.xs[i],P.ys[i],r,0,TAU);}
  ctx.fill(); ctx.restore();
}
function dot(ctx,x,y,r,color=RED,alpha=1){if(r<=0||alpha<=0)return; ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill(); ctx.restore();}
const bez=(a,c,b,t)=>[(1-t)*(1-t)*a[0]+2*(1-t)*t*c[0]+t*t*b[0],(1-t)*(1-t)*a[1]+2*(1-t)*t*c[1]+t*t*b[1]];

// ---------- engravings
function tr(key,ax,ay,fx,fy,s){const w=W*s,h=w*AR; return {key,ox:fx-ax*w,oy:fy-ay*h,w,h,s};}
const pt=(T,nx,ny)=>[T.ox+nx*T.w,T.oy+ny*T.h];
function drawT(ctx,T,alpha=1){if(alpha<=0)return; ctx.globalAlpha=alpha; ctx.drawImage(IMG[T.key],T.ox,T.oy,T.w,T.h); ctx.globalAlpha=1;}
function paperDisc(ctx,x,y,r){if(r<=0.5)return; ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.clip(); ctx.drawImage(paperC,0,0); ctx.restore();}

// door leaf swinging on its hinges (left edge), true perspective, built from the engraving itself
function drawDoor(ctx,T,theta){
  const img=IMG.A05, iw=img.width, ih=img.height;
  if(theta<0.003){drawT(ctx,T);return;}
  const L0=0.3965,L1=0.7675,Y0=0.4905,Y1=0.8765,KX=0.793,KY0=0.686,KY1=0.738;
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,H);
  ctx.rect(T.ox+L0*T.w,T.oy+Y0*T.h,(L1-L0)*T.w,(Y1-Y0)*T.h);
  ctx.rect(T.ox+L1*T.w-1,T.oy+KY0*T.h,(KX-L1)*T.w+1,(KY1-KY0)*T.h);
  ctx.clip('evenodd'); drawT(ctx,T); ctx.restore();
  const wpx=(L1-L0)*T.w, D=3.3*wpx, xc=T.ox+(L0+L1)/2*T.w, yh=T.oy+0.665*T.h, co=Math.cos(theta), si=Math.sin(theta);
  const proj=u=>{const X=-wpx/2+u*wpx*co, Z=D-u*wpx*si; return [xc+D*X/Z,D/Z];};
  const strip=(u0,u1,y0,y1)=>{const [xa,va]=proj(u0),[xb,vb]=proj(u1), v=(va+vb)/2;
    const top=T.oy+y0*T.h, dy=yh-(yh-top)*v, dh=(y1-y0)*T.h*v;
    ctx.drawImage(img,(L0+u0*(L1-L0))*iw,y0*ih,(u1-u0)*(L1-L0)*iw,(y1-y0)*ih,xa-0.35,dy,xb-xa+0.7,dh);};
  const N=72; for(let j=0;j<N;j++)strip(j/N,(j+1)/N,Y0,Y1);
  const uk=(KX-L0)/(L1-L0), M=5; for(let j=0;j<M;j++)strip(1+(uk-1)*j/M,1+(uk-1)*(j+1)/M,KY0,KY1);
}

// ---------- transition marks: icon -> red shape morph -> icon, inside a painted ring
const MK=[CX,1064], MR=176, MD=292;
const MARKS=[
  {tc:4.0, a:'I02',b:'I01'},
  {tc:8.5, a:'I01',b:'I05'},
  {tc:10.5,a:'I05',b:'I03'},
  {tc:12.5,a:'I03',b:'I04'},
  {tc:17.0,a:'I04',b:'I02',stay:19.58},
  {tc:20.0,a:'I02',b:'I06',fromStay:true},
  {tc:24.5,a:'I06',b:'I03'},
  {tc:29.0,a:'I03',b:'I02'},
];
const blobC=document.createElement('canvas'); blobC.width=blobC.height=320; const blobX=blobC.getContext('2d'); const blobID=new ImageData(320,320);
function drawBlob(ctx,a,b,p,x,y,size,alpha){
  const A=SDFI[a], B=SDFI[b], d=blobID.data, q=1-p;
  for(let i=0,j=0;i<A.length;i++,j+=4){const v=(A[i]*q+B[i]*p)*0.9+0.5; if(v<=0){d[j+3]=0;continue;} d[j]=139;d[j+1]=30;d[j+2]=26;d[j+3]=v>=1?255:v*255;}
  blobX.putImageData(blobID,0,0);
  ctx.save(); ctx.globalAlpha=alpha; ctx.imageSmoothingQuality='high'; ctx.drawImage(blobC,x-size/2,y-size/2,size,size); ctx.restore();
}
function drawIcon(ctx,key,x,y,size,alpha,rot=0){
  if(alpha<=0||size<=1)return; ctx.save(); ctx.globalAlpha=alpha; ctx.translate(x,y); if(rot)ctx.rotate(rot);
  ctx.imageSmoothingQuality='high'; ctx.drawImage(IMG[key],-size/2,-size/2,size,size); ctx.restore();
}
function drawMark(ctx,t,m){
  const [x,y]=MK, tc=m.tc, t0=tc-0.42, tEnd=m.stay?m.stay:tc+0.42;
  if(t<t0||t>tEnd)return;
  const leaving=m.stay?0:ei3(prog(t,tc+0.30,tc+0.42));
  const pin=m.fromStay?1:spring(t-t0,5.2,0.82);
  paperDisc(ctx,x,y,MR*pin*(1-leaving));
  // ring
  const ru1=eio(prog(t,t0+0.03,t0+0.25)), ru0=eio(prog(t,tc+0.2,tc+0.4));
  if(ru1>ru0)brush(ctx,ellipsePts(x,y,MR,MR,-0.2,-2.1,1.06,tc),ru0,ru1,7.5);
  // icons
  const u=prog(t,tc-0.15,tc+0.15), live=1-leaving;
  const k=m.fromStay?1.035*1.05:(1+0.035*smooth(prog(t,t0,tc+0.42)))*(m.stay?1+0.05*smooth(prog(t,tc+0.15,m.stay)):1);
  const scA=m.fromStay?1:lerp(0.62,1,spring(t-t0,4.6,0.7));

    for(const m of MARKS)drawMark(ctx,t,m);
    const U=portaUnder(); if(!flight(ctx,t,10.94,11.18,MK,[U.x0,U.y],-120)&&t>11.18&&t<11.25)dot(ctx,U.x0,U.y,10);
    const T=a06T(13.25), tp=pt(T,TEAR[0][0],TEAR[0][1]); flight(ctx,t,12.92,13.25,MK,tp,-90);
    flight(ctx,t,24.9,25.0,MK,PIN,-60);
  }
}

// ---------- frames: 4 sub-frames blended (motion blur)
function seek(t){drawScene(acc,t);}
function renderFrame(i,n=SUB){
  for(let k=0;k<n;k++){drawScene(sub,(i+k*SHUTTER/n)/FPS); acc.globalAlpha=1/(k+1); acc.drawImage(subC,0,0);}
  acc.globalAlpha=1;
}
function frameJPEG(i,q=0.97){renderFrame(i); return stage.toDataURL('image/jpeg',q);}
function framePNG(i){renderFrame(i); return stage.toDataURL('image/png');}
function textBBox(t){ // bounding box of every text pixel at time t
  LAYER='text'; drawScene(sub,t); LAYER='all';
  const d=new Uint32Array(sub.getImageData(0,0,W,H).data.buffer); let x0=W,y0=H,x1=-1,y1=-1;
  for(let y=0;y<H;y++){const o=y*W; let a=-1,b=-1; for(let x=0;x<W;x++)if((d[o+x]>>>24)>10){a=x;break;}
    if(a<0)continue; for(let x=W-1;x>=a;x--)if((d[o+x]>>>24)>10){b=x;break;}
    if(a<x0)x0=a; if(b>x1)x1=b; if(y<y0)y0=y; if(y>y1)y1=y;}
  return x1<0?null:[x0,y0,x1,y1];
}
Object.assign(window,{seek,renderFrame,frameJPEG,framePNG,textBBox,drawScene,W,H,FPS,DUR,NF});

(async function init(){
  const R=new URLSearchParams(location.search).has('render'); if(R)document.body.classList.add('render');
  makePaper();
  await Promise.all([document.fonts.load(fAnton(80),'AÉ'),document.fonts.load(fKey(80),'AÉ'),document.fonts.load(fSup(40),'aé'),document.fonts.load(fCP(40),'aé'),document.fonts.load(fCPB(40),'AÉ')]);
  for(const k of Object.keys(ASSETS)){
    IMG[k]=await inkLayer(ASSETS[k].a,ASSETS[k].s);
    if(ASSETS[k].m){const im=await loadImage(ASSETS[k].m); mC.width=mC.height=320; mX.clearRect(0,0,320,320); mX.drawImage(im,0,0,320,320);
      const d=mX.getImageData(0,0,320,320).data, al=new Float32Array(320*320); for(let i=0;i<al.length;i++)al[i]=d[i*4]/255; SDFI[k]=sdfFromAlpha(al,320,320,46);}
  }
  layout();
  window.ready=true;
  if(R){renderFrame(0);return;}
  // live preview: click to pause, bar to scrub
  let playing=true, base=performance.now(), cur=-1, cost=0;
  const fill=document.getElementById('fill'), bar=document.getElementById('bar');
  stage.addEventListener('click',()=>{playing=!playing; if(playing)base=performance.now()-cur/FPS*1000;});
  bar.addEventListener('click',e=>{const r=bar.getBoundingClientRect(); cur=Math.floor((e.clientX-r.left)/r.width*NF); base=performance.now()-cur/FPS*1000; renderFrame(cur); fill.style.width=(cur/NF*100)+'%';});
  (function loop(){
    if(playing){const i=Math.floor(((performance.now()-base)/1000*FPS)%NF);
      if(i!==cur){const a=performance.now(); renderFrame(i,cost>26?(cost>52?1:2):SUB); cost=(performance.now()-a)*(cost>26?(cost>52?4:2):1); cur=i; fill.style.width=(i/NF*100)+'%';}}
    requestAnimationFrame(loop);
  })();
})();
</script>
