<script>
'use strict';
/* ---------- math ---------- */
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const E={lin:t=>t,io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,in:t=>t*t*t,out:t=>1-Math.pow(1-t,3),
  in2:t=>t*t,out2:t=>1-(1-t)*(1-t),sine:t=>.5-.5*Math.cos(Math.PI*t)};
// piecewise keyframes with one ease (or per-key ease as 3rd element)
function kf(f,tb,ease){ease=ease||'io';
  if(f<=tb[0][0])return tb[0][1];
  for(let i=0;i<tb.length-1;i++){const a=tb[i],b=tb[i+1];
    if(f<=b[0]){const t=(f-a[0])/(b[0]-a[0]);const e=E[b[2]||ease];return lerp(a[1],b[1],e(t));}}
  return tb[tb.length-1][1];}
// monotone cubic through key table (velocity continuous); extrapolates flat
function mc(f,tb,vEnd){const n=tb.length;
  if(f<=tb[0][0])return tb[0][1];
  if(f>=tb[n-1][0])return tb[n-1][1]+(vEnd||0)*(f-tb[n-1][0]);
  const xs=tb.map(p=>p[0]),ys=tb.map(p=>p[1]);const d=[],m=[];
  for(let i=0;i<n-1;i++)d.push((ys[i+1]-ys[i])/(xs[i+1]-xs[i]));
  m[0]=d[0];m[n-1]=vEnd!==undefined?vEnd:d[n-2];
  for(let i=1;i<n-1;i++){if(d[i-1]*d[i]<=0)m[i]=0;else{const w1=2*(xs[i+1]-xs[i])+(xs[i]-xs[i-1]),w2=(xs[i+1]-xs[i])+2*(xs[i]-xs[i-1]);m[i]=(w1+w2)/(w1/d[i-1]+w2/d[i]);}}
  let i=0;while(f>xs[i+1])i++;
  const h=xs[i+1]-xs[i],t=(f-xs[i])/h,t2=t*t,t3=t2*t;
  return (2*t3-3*t2+1)*ys[i]+(t3-2*t2+t)*h*m[i]+(-2*t3+3*t2)*ys[i+1]+(t3-t2)*h*m[i+1];}
// per-frame lookup table with linear interpolation
function lut(f,f0,arr){const x=clamp(f-f0,0,arr.length-1);const i=Math.min(arr.length-2,Math.max(0,Math.floor(x)));return lerp(arr[i],arr[i+1],x-i);}
// exponential approach: remaining distance shrinks by p per frame
const expo=(f,f0,from,to,p)=>to+(from-to)*Math.pow(1-p,Math.max(0,f-f0));
// seeded hash
function hash(n){n=(n^61)^(n>>>16);n=n+(n<<3);n=n^(n>>>4);n=Math.imul(n,0x27d4eb2d);n=n^(n>>>15);return (n>>>0)/4294967296;}
/* ---------- dom helpers ---------- */
const stage=document.getElementById('stage');
function el(parent,css,html,tag){const e=document.createElement(tag||'div');e.className='abs';if(css)e.style.cssText+=css;if(html!==undefined)e.innerHTML=html;parent.appendChild(e);return e;}
const S=(e,o)=>{for(const k in o)e.style[k]=o[k];};
const px=v=>v.toFixed(3)+'px';
function setBlur(id,sx,sy){document.getElementById(id).setAttribute('stdDeviation',Math.max(0,sx).toFixed(3)+' '+Math.max(0,sy).toFixed(3));}
/* ---------- cursor ---------- */
const ARROW='<path d="M2.4 2.2 L2.4 27.4 L8.6 21.6 L12.6 30.6 L16.8 28.8 L12.9 20.1 L21.2 20.1 Z" fill="#000" stroke="#fff" stroke-width="2.3" stroke-linejoin="round"/>';
function makeCursor(parent){const g=el(parent,'');g.className='cur';const copies=[];
  for(let i=0;i<6;i++){const c=el(g,'width:0;height:0');c.innerHTML='<svg width="34" height="44" viewBox="0 0 24 33" style="filter:drop-shadow(0 1.5px 2.2px rgba(0,0,0,.32))">'+ARROW+'</svg>';copies.push(c);}
  return {g,copies,set(fn,f){ // fn(f)->{x,y,r,s,o}
    for(let i=0;i<copies.length;i++){const ff=f-i*0.09;const p=fn(ff);const q=fn(f);
      const sp=Math.hypot(fn(f).x-fn(f-1).x,fn(f).y-fn(f-1).y);
      const op=i===0?q.o:(sp>2?q.o*0.33*(1-i/copies.length)*clamp((sp-2)/10,0,1):0);
      S(copies[i],{transform:`translate(${px(p.x)},${px(p.y)}) rotate(${(p.r||0).toFixed(3)}deg) scale(${(p.s||1).toFixed(4)})`,opacity:op.toFixed(3),zIndex:6-i});}
  }};}
/* ---------- generated art (seeded, no text) ---------- */
function canvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function blueLight(w,h,seed,mode){const c=canvas(w,h),x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,w*.3,h);
  if(mode==='light'){g.addColorStop(0,'#E6F0FA');g.addColorStop(.55,'#B7CFEB');g.addColorStop(1,'#769CC2');}
  else if(mode==='mint'){g.addColorStop(0,'#1E2F52');g.addColorStop(.6,'#294376');g.addColorStop(1,'#3E7F86');}
  else{g.addColorStop(0,'#1E2F52');g.addColorStop(.5,'#294376');g.addColorStop(1,'#769CC2');}
  x.fillStyle=g;x.fillRect(0,0,w,h);
  const cols=mode==='mint'?['#4ED6A0','#3CC8F0','#E6F0FA','#2F6BFF']:mode==='deep'?['#2F6BFF','#3CC8F0','#294376','#769CC2']:['#3CC8F0','#2F6BFF','#E6F0FA','#B7CFEB'];
  x.globalCompositeOperation='screen';
  for(let i=0;i<9;i++){const cx=w*(0.1+0.8*hash(seed*31+i*7)),cy=h*(0.1+0.8*hash(seed*17+i*13)),r=Math.max(w,h)*(0.18+0.32*hash(seed*7+i*5));
    const rg=x.createRadialGradient(cx,cy,0,cx,cy,r);const col=cols[i%cols.length];
    rg.addColorStop(0,col+(i%3===2?'88':'cc'));rg.addColorStop(1,col+'00');x.fillStyle=rg;
    x.save();x.translate(cx,cy);x.scale(1+hash(seed+i)*1.2,0.55+hash(seed*3+i)*0.5);x.rotate(hash(seed*9+i)*3);x.translate(-cx,-cy);
    x.beginPath();x.arc(cx,cy,r,0,7);x.fill();x.restore();}
  // soft light ribbons
  x.globalCompositeOperation='screen';x.filter='blur('+(w*0.02).toFixed(1)+'px)';
  for(let i=0;i<3;i++){x.strokeStyle='rgba(230,244,255,'+(0.25+0.15*hash(seed+i*91))+')';x.lineWidth=w*(0.02+0.03*hash(seed*5+i));
    x.beginPath();const y0=h*(0.2+0.6*hash(seed*11+i));x.moveTo(-w*.1,y0);
    x.bezierCurveTo(w*.3,y0-h*(0.4*hash(seed+i*3)-.2),w*.6,y0+h*(0.4*hash(seed+i*5)-.2),w*1.1,y0+h*(0.3*hash(seed*2+i)-.15));x.stroke();}
  x.filter='none';x.globalCompositeOperation='source-over';
  return c;}
function blurred(src,b,bright,white){const c=canvas(src.width,src.height),x=c.getContext('2d');
  x.filter=`blur(${b}px) brightness(${bright})`;const m=b*2;x.drawImage(src,-m,-m,src.width+2*m,src.height+2*m);x.filter='none';
  x.fillStyle=`rgba(255,255,255,${white})`;x.fillRect(0,0,c.width,c.height);return c;}
function wallpaper(w,h){const c=canvas(w,h),x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#294376');g.addColorStop(1,'#769CC2');x.fillStyle=g;x.fillRect(0,0,w,h);
  const tg=x.createRadialGradient(w*.86,h*.04,0,w*.86,h*.04,w*.42);tg.addColorStop(0,'rgba(60,200,240,.55)');tg.addColorStop(1,'rgba(60,200,240,0)');x.fillStyle=tg;x.fillRect(0,0,w,h);
  x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=1.6;
  const cx=w*.42,cy=h*.47,R=h*.36;x.beginPath();x.arc(cx,cy,R,0,7);x.stroke();
  x.beginPath();x.moveTo(0,h*.30);x.lineTo(w,h*.30);x.stroke();
  x.beginPath();x.moveTo(0,h*.74);x.lineTo(w,h*.74);x.stroke();
  const vx=w*.66;x.beginPath();x.moveTo(vx,0);x.lineTo(vx,h);x.stroke();
  // four-point sparkle at crossing (vx, h*.30)
  const sx=vx,sy=h*.30;x.fillStyle='#fff';x.beginPath();const a=22,b=3.2;
  x.moveTo(sx,sy-a);x.quadraticCurveTo(sx+b,sy-b,sx+a,sy);x.quadraticCurveTo(sx+b,sy+b,sx,sy+a);x.quadraticCurveTo(sx-b,sy+b,sx-a,sy);x.quadraticCurveTo(sx-b,sy-b,sx,sy-a);x.fill();
  return c;}
/* ---------- shots ---------- */
const shots=[];
function shot(f0,f1,build,render){const o={f0,f1,build:()=>{const root=el(stage,'');root.className='shot';o.root=root;const st=build(root);o.render=(lf,f)=>render(f,lf,st,root);}};shots.push(o);}
var M={}; // measurements after fonts

/* ===== S1 f0–71 header + window + click ===== */
shot(0,71,root=>{
  const s={};
  s.bg=el(root,'inset:0;width:1080px;height:1080px;background:#FDFDFB');
  s.haze=el(root,'width:1080px;height:1080px;background:radial-gradient(120% 90% at 50% 70%,#B7CFEB 0%,#C9DBF0 55%,#DCE8F6 100%)');
  s.floor=el(root,'width:1400px;height:700px;left:-160px;top:760px;background:radial-gradient(50% 50% at 50% 50%,#DBEEFD 0%,rgba(219,238,253,0) 100%)');
  s.cam=el(root,'width:1080px;height:1080px;transform-origin:540px 540px');
  // window
  s.win=el(s.cam,'left:408px;top:405px;width:900px;height:900px;border-radius:93px;background:#FCFDFF;overflow:hidden;box-shadow:0 30px 80px rgba(41,67,118,.16),0 0 0 1px rgba(41,67,118,.07)');
  el(s.win,'left:0;top:0;width:900px;height:66px;background:#F1F6FF;border-bottom:1px solid #E5EDF8');
  el(s.win,'left:-100px;top:520px;width:1100px;height:600px;background:radial-gradient(50% 45% at 50% 70%,#DBEEFD 0%,rgba(219,238,253,0) 100%)');
  // search pill
  el(s.win,'left:118px;top:13px;width:380px;height:40px;border-radius:20px;background:#fff;box-shadow:0 0 0 1px #E1E9F5',
    '<svg class="abs" style="left:16px;top:11px" width="18" height="18" viewBox="0 0 18 18"><circle cx="7.5" cy="7.5" r="5.6" fill="none" stroke="#9AA8BD" stroke-width="2"/><path d="M12 12l4.2 4.2" stroke="#9AA8BD" stroke-width="2" stroke-linecap="round"/></svg><div class="abs" style="left:44px;top:9px;font:400 18px Inter;color:#9AA8BD;white-space:nowrap">Buscar no curso</div>');
  // left icon column (centres at stage (537,739) and (537,900))
  const icon=(cx,cy,op,label,glyph)=>{const g=el(s.win,`left:${cx-408-36}px;top:${cy-405-36}px;width:72px;height:72px;opacity:${op}`);
    el(g,'width:72px;height:72px;border-radius:22px;background:'+(op>.9?'linear-gradient(160deg,#2F6BFF,#294376)':'#E6F0FA'),glyph);
    el(g,'top:82px;left:-30px;width:132px;text-align:center;font:500 19px Inter;color:'+(op>.9?'#1E2F52':'#6B7A93'),label);};
  icon(537,739,1,'Cursos','<svg class="abs" style="left:18px;top:19px" width="36" height="34" viewBox="0 0 36 34"><path d="M3 5c5-2 10-2 15 1v24c-5-3-10-3-15-1z M33 5c-5-2-10-2-15 1v24c5-3 10-3 15-1z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/></svg>');
  icon(537,900,.45,'Comunidade','<svg class="abs" style="left:16px;top:20px" width="40" height="32" viewBox="0 0 40 32"><circle cx="14" cy="10" r="6" fill="none" stroke="#294376" stroke-width="2.6"/><circle cx="28" cy="12" r="5" fill="none" stroke="#294376" stroke-width="2.6"/><path d="M3 29c1-7 6-10 11-10s10 3 11 10M24 22c5-2 11 0 13 7" fill="none" stroke="#294376" stroke-width="2.6" stroke-linecap="round"/></svg>');
  // course card from (764,700)
  s.card=el(s.win,`left:${764-408}px;top:${700-405}px;width:620px;height:520px;border-radius:40px;background:#fff;box-shadow:0 18px 50px rgba(41,67,118,.14),0 0 0 1px rgba(41,67,118,.06);overflow:hidden`);
  s.cover=blueLight(600,226,3,'blue');s.cover.className='abs';s.cover.style.cssText+='left:14px;top:14px;width:600px;height:226px;border-radius:28px';
  s.card.appendChild(s.cover);
  el(s.card,'left:30px;top:258px;font:600 32px Inter;color:#111;white-space:nowrap;letter-spacing:-.3px','Protocolo 7 Dias');
  el(s.card,'left:30px;top:302px;font:400 23px Inter;color:#7B8494;white-space:nowrap','Curso · 7 dias');
  // header lockup
  s.lock=el(s.cam,'left:474px;top:0;width:589px;height:132px');
  s.ring=el(s.lock,'left:-21px;top:-21px;width:174px;height:174px;border-radius:50%;background:radial-gradient(circle,#D5F3FF 0%,#D5F3FF 72%,#F7FEFF 88%,rgba(247,254,255,0) 100%)');
  s.disc=el(s.lock,'left:0;top:0;width:132px;height:132px;border-radius:50%;background:#FBFCFE;box-shadow:0 0 0 1px #E8E8EA,0 6px 18px rgba(41,67,118,.10)');
  el(s.disc,'left:7px;top:7px;width:118px;height:118px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#294376,#1E2F52)');
  el(s.disc,'left:9px;top:9px;width:114px;height:114px').className='abs logo';
  s.name=el(s.lock,'top:0;font:500 40px Inter;color:#111;white-space:nowrap;letter-spacing:-.4px','Protocolo 7 Dias');
  s.pill=el(s.lock,'top:0;height:44px;border-radius:22px;background:#2F2E2F;color:#fff;font:500 22px Inter;white-space:nowrap;line-height:44px;padding:0 18px','na Hotmart');
  s.cursor=makeCursor(s.cam);
  return s;
},(f,F,s)=>{
  S(s.haze,{opacity:kf(f,[[0,1],[28,0]],'out2').toFixed(4)});
  // lockup centre line
  let cy=mc(f,[[0,932],[2,776],[5,683],[10,608],[24,546],[37,536]],-1);
  S(s.lock,{top:px(cy-66)});
  const L=M.lock; // measured
  S(s.name,{left:px(L.nameX),top:px(66-L.nameH/2),fontSize:L.nameFs+'px'});
  const nb=kf(f,[[2,10],[5,4],[9,0]],'out');S(s.name,{opacity:kf(f,[[1.6,0],[2,.55],[5,1]],'out').toFixed(3),filter:`blur(${nb.toFixed(2)}px)`});
  const pb=kf(f,[[4,18],[5,11],[9,2],[13,0]],'out');
  S(s.pill,{left:px(L.pillX+kf(f,[[4,15],[13,0]],'out')),top:px(66-L.pillH/2),fontSize:L.pillFs+'px',height:px(L.pillH),lineHeight:px(L.pillH),padding:`0 ${px(L.pillPad)}`,borderRadius:px(L.pillH/2),
    opacity:kf(f,[[3.6,0],[4,.35],[5,.7],[8,1]],'out').toFixed(3),filter:`blur(${pb.toFixed(2)}px)`});
  // disc rises from below with vertical smear on fast frames
  const v=Math.abs(mc(f,[[0,932],[2,776],[5,683],[10,608],[24,546],[37,536]],-1)-mc(f-1,[[0,932],[2,776],[5,683],[10,608],[24,546],[37,536]],-1));
  S(s.disc,{filter:v>3?`blur(${Math.min(8,v*0.06).toFixed(2)}px)`:'none'});
  // ring
  const rg=kf(f,[[53,0],[58,1]],'out');S(s.ring,{opacity:rg.toFixed(3),transform:`scale(${(0.86+0.14*rg).toFixed(4)})`});

  S(s.win,{opacity:kf(f,[[14,0],[15,.53],[19,.7],[24,1]],'lin').toFixed(3)});
  // camera
  let z=1;if(f<=46)z=1;else if(f<=60)z=lerp(1,1.2,E.io((f-46)/14));else if(f<=61)z=1.2;else z=lerp(1.2,1.04,E.in((f-61)/10));
  S(s.cam,{transform:`scale(${z.toFixed(5)})`});
  const zb=f>61?Math.abs(z-(f-1>61?lerp(1.2,1.04,E.in((f-62)/10)):1.2))*40:0;

  const ex=f>238?Math.min(9,vy*0.45):0;
  const vbB=Math.abs(tb-mc(f-1,[[215,927],[217,860],[220,700],[224,600],[228,562],[232,553],[236,552]]))*0.05;
  setBlur('fb6ag',ba,Math.max(ba,ex));setBlur('fb6bg',bb,Math.max(bb,ex,vbB));
});

/* ===== S7 f245–300 logo disc ===== */
shot(245,300,root=>{const s={};
  el(root,'width:1080px;height:1080px;background:#FDFDFB');
  s.d=el(root,'width:168px;height:168px;border-radius:50%;background:#F6F6F6;box-shadow:0 0 0 1px #E8E8EA,0 10px 28px rgba(30,47,82,.12);filter:url(#fb7)');

  el(s.d,'left:11px;top:11px;width:146px;height:146px').className='abs logo';
  return s;},(f,F,s)=>{
  const top=mc(f,[[245,569],[250,491],[255,468],[262,459],[269,456]]);
  let d=168;if(f>287)d=kf(f,[[287,168],[300,123]],'in');

  const v=Math.abs(mc(f,[[245,569],[250,491],[255,468],[262,459],[269,456]])-mc(f-1,[[245,569],[250,491],[255,468],[262,459],[269,456]]));
  const vs=f<246?14:Math.min(10,v*0.4);
  const sb=f>287?kf(f,[[292,0],[300,1.6]],'in'):0;
  setBlur('fb7g',sb,Math.max(f<269?vs:0,sb));
});

/* ===== S8 f301–359 end card ===== */
shot(301,359,root=>{const s={};
  el(root,'width:1080px;height:1080px;background:radial-gradient(circle at 50% 50%,#272729 0%,#121214 45%,#020204 100%)');
  s.halo=el(root,'left:240px;top:390px;width:600px;height:300px;border-radius:50%;background:radial-gradient(closest-side,rgba(243,243,245,.16),rgba(243,243,245,0))');
  s.wrap=el(root,'width:1080px;height:1080px;filter:url(#fb8)');
  s.streaks=[];for(let i=0;i<26;i++)s.streaks.push(el(s.wrap,'left:540px;top:540px;font:600 100px Inter;color:#F3F3F5;white-space:nowrap;transform-origin:0 0','Protocolo 7 Dias'));
  s.word=el(s.wrap,'left:540px;top:540px;font:600 100px Inter;color:#F3F3F5;white-space:nowrap;transform-origin:0 0;text-shadow:0 0 6px rgba(243,243,245,.55),0 0 34px rgba(200,220,255,.28)','Protocolo 7 Dias');
  return s;},(f,F,s)=>{
  const W=[[301,1650],[302,1350],[303,1110],[304,1049],[309,734],[311,678],[320,563],[342,516],[350,492],[355,450],[359,267]];
  const w=f<=350?mc(f,W.slice(0,10)):kf(f,[[350,492],[355,450,'in'],[359,267,'in']],'in');
  const w1=f<=350?mc(f-1,W.slice(0,10)):kf(f-1,[[350,492],[355,450,'in'],[359,267,'in']],'in');
  const sc=w/M.word.w;
  const place=(e,k,op)=>{const ss=sc*k;S(e,{transform:`translate(${px(-M.word.w*ss/2)},${px(-M.word.h*ss/2)}) scale(${ss.toFixed(5)})`,opacity:op.toFixed(4)});};
  place(s.word,1,1);
  const rel=Math.max(0,(w1-w)/w); // relative shrink per frame
  for(let i=0;i<s.streaks.length;i++){const k=1+rel*1.4*(i+1)/s.streaks.length;place(s.streaks[i],k,rel>0.004?0.10*(1-i/s.streaks.length)*clamp(rel*8,0,1):0);}
  S(s.halo,{transform:`scale(${(w/516).toFixed(4)},${(0.6+0.4*w/516).toFixed(4)})`,transformOrigin:'300px 150px',opacity:kf(f,[[301,.6],[306,1]],'out').toFixed(3)});
  const hb=f<305?kf(f,[[301,14],[305,0]],'out'):0;
  const cb=f>350?kf(f,[[350,0],[359,3.5]],'in'):0;
  setBlur('fb8g',Math.max(hb,cb),Math.max(cb,hb*0.12));
});

/* ---------- measure + seek ---------- */
function measure(){
  const probe=(font,txt)=>{const d=el(stage,`font:${font};white-space:pre;visibility:hidden;left:0;top:0`,'');d.textContent=txt;const r=d.getBoundingClientRect();d.remove();return {w:r.width,h:r.height};};
  // lockup: disc 132 + gap + name + gap + pill = 589
  const sol=fs=>{const n=probe(`500 ${fs}px Inter`,'Protocolo 7 Dias');const pf=fs*0.56,pad=pf*0.82;const p=probe(`500 ${pf}px Inter`,'na Hotmart');
    const gap1=fs*0.55,gap2=fs*0.42;return {fs,n,pf,pad,pw:p.w+2*pad,gap1,gap2,total:132+gap1+n.w+gap2+p.w+2*pad};};
  let lo=10,hi=80;for(let i=0;i<30;i++){const m=(lo+hi)/2;if(sol(m).total>589)hi=m;else lo=m;}
  const r=sol(lo);
  M.lock={nameFs:r.fs.toFixed(3),nameX:132+r.gap1,nameH:r.n.h,pillFs:r.pf.toFixed(3),pillPad:r.pad,pillH:r.pf*2,pillX:132+r.gap1+r.n.w+r.gap2,total:r.total};
  M.type=[];for(let i=0;i<=TYPE.length;i++)M.type[i]=probe('500 40px Inter',TYPE.slice(0,i)).w-(i?0:0);
  // letter-spacing -.3 applied in box text
  for(let i=0;i<=TYPE.length;i++)M.type[i]+=-0.3*i;
  M.word=probe('600 100px Inter','Protocolo 7 Dias');
  // key phrase centre in S4 (offset 0)
  const s4=shots[3];s4.root.style.display='block';const kp=document.getElementById('kp');const rr=kp.getClientRects();const sr=stage.getBoundingClientRect();
  const last=rr[0];M.kp={x:last.left-sr.left+last.width/2,y:last.bottom-sr.top-9};
  s4.root.style.display='none';
}
var READY=false;
window.seek=function(f){
  for(const s of shots){const on=f>=s.f0&&f<s.f1+1;s.root.style.display=on?'block':'none';if(on)s.render(f-s.f0,f);}
};
document.fonts.load('500 40px Inter').then(()=>Promise.all(['400','500','600','700'].map(w=>document.fonts.load(`${w} 40px Inter`,'ãéúçÃÉ·')))).then(()=>document.fonts.ready).then(()=>{shots.forEach(o=>o.build());measure();READY=true;window.seek(+(new URLSearchParams(location.search).get('f')||0));});
