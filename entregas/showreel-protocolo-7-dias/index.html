<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Protocolo 7 Dias Showreel</title>
<style>
@font-face{font-family:'Archivo Black';src:url(fonts/f1.ttf)}
@font-face{font-family:'Poppins';font-weight:400;src:url(fonts/f2.ttf)}
@font-face{font-family:'Poppins';font-weight:500;src:url(fonts/f3.ttf)}
@font-face{font-family:'Poppins';font-weight:600;src:url(fonts/f4.ttf)}
html,body{margin:0;padding:0;background:#EDE4D3}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#EDE4D3}
#cam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px}
.a{position:absolute;box-sizing:border-box}
.ab{font-family:'Archivo Black';font-weight:400}
.pp{font-family:'Poppins'}
.mask{display:block;overflow:hidden;padding:.18em 0 .24em;margin:-.18em 0 -.24em}
.mask>span{display:inline-block;white-space:pre}
</style>
</head>
<body>
<div id="stage"><div id="cam"></div></div>
<svg width="0" height="0" style="position:absolute"><defs id="defs"></defs></svg>
<script>
'use strict';
const W=1080,H=1920,CREAM='#EDE4D3',INK='#1A1A1A',BRICK='#A62B24';
const DAYS=[
 {n:1,bg:'#A62B24',fg:CREAM,name:['Frase fixa','de presença']},
 {n:2,bg:'#E0662B',fg:INK,name:['Limite','sem briga']},
 {n:3,bg:'#E2A72E',fg:INK,name:['Pausa combinada','de 20 minutos']},
 {n:4,bg:'#7C8B3A',fg:INK,name:['Roteiro de','pós-crise']},
 {n:5,bg:'#1F7A74',fg:CREAM,name:['Sair dos detalhes','no auge']},
 {n:6,bg:'#2F5D9B',fg:CREAM,name:['Regra de','previsibilidade']},
 {n:7,bg:'#6B3F73',fg:CREAM,name:['Autocuidado de','quem cuida']},
];
const LIST_NAMES=['Frase fixa de presença','Limite sem briga','Pausa combinada de 20 minutos','Roteiro de pós-crise','Sair dos detalhes no auge','Regra de previsibilidade','Autocuidado de quem cuida'];
const RR=9/34; // site's step tile radius ratio

/* ---------- math ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
const expoOut=p=>p<=0?0:p>=1?1:1-Math.pow(2,-10*p);
const expoIn=p=>p<=0?0:p>=1?1:Math.pow(2,10*(p-1));
const expoIO=p=>p<=0?0:p>=1?1:p<.5?Math.pow(2,20*p-10)/2:(2-Math.pow(2,-20*p+10))/2;
const easeIO=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
function spring(t,a,d){ // critically-ish damped, ~2% overshoot max
  if(t<=a) return 0; const u=(t-a)/d; if(u>=1) return 1;
  const z=0.78,w=7.5,wd=w*Math.sqrt(1-z*z);
  return 1-Math.exp(-z*w*u)*(Math.cos(wd*u)+(z*w/wd)*Math.sin(wd*u));
}
const hash=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const bump=(t,a,d)=>{const p=prog(t,a,a+d);return Math.sin(Math.PI*p)};

/* ---------- dom helpers ---------- */
const cam=document.getElementById('cam'),defs=document.getElementById('defs');
function mk(parent,css={},cls='a',txt){const e=document.createElement('div');e.className=cls;Object.assign(e.style,css);if(txt!=null)e.textContent=txt;parent.appendChild(e);return e}
function box(e,x,y,w,h,r){const s=e.style;s.left=x+'px';s.top=y+'px';s.width=Math.max(0,w)+'px';s.height=Math.max(0,h)+'px';if(r!=null)s.borderRadius=r+'px'}
function tile(e,cx,cy,s,ratio=RR){box(e,cx-s/2,cy-s/2,s,s,s*ratio)}
function vis(e,v){e.style.display=v?'':'none'}
function maskLine(parent,text,css,cls){const m=document.createElement('div');m.className='mask '+(cls||'');Object.assign(m.style,css||{});const s=document.createElement('span');s.textContent=text;m.appendChild(s);parent.appendChild(m);return s}
const rise=(s,p)=>{s.style.transform=`translateY(${((1-p)*118).toFixed(2)}%)`};
let mbN=0;
function mb(){const NS='http://www.w3.org/2000/svg';const f=document.createElementNS(NS,'filter');const id='mb'+(mbN++);f.setAttribute('id',id);f.setAttribute('x','-60%');f.setAttribute('y','-60%');f.setAttribute('width','220%');f.setAttribute('height','220%');const g=document.createElementNS(NS,'feGaussianBlur');g.setAttribute('stdDeviation','0 0');f.appendChild(g);defs.appendChild(f);return {id,g}}
function mbSet(e,m,vx,vy){const k=0.0042;const sx=Math.min(18,Math.abs(vx)*k),sy=Math.min(18,Math.abs(vy)*k);if(sx<0.45&&sy<0.45){e.style.filter='none';return}m.g.setAttribute('stdDeviation',sx.toFixed(2)+' '+sy.toFixed(2));e.style.filter=`url(#${m.id})`}
function vel(f,t){const a=f(t),b=f(t-0.008);return [(a[0]-b[0])/0.008,(a[1]-b[1])/0.008]}
function rectOf(e){const r=e.getBoundingClientRect(),s=document.getElementById('stage').getBoundingClientRect();return {x:r.left-s.left,y:r.top-s.top,w:r.width,h:r.height,cx:r.left-s.left+r.width/2,cy:r.top-s.top+r.height/2}}

/* =========================================================
   HOOK  0–4 s
   ========================================================= */
const hook=mk(cam,{},'scene');
const hookBlock=mk(hook,{left:'90px',top:'430px',width:'900px'});
const HF=172;
const hookLines=[];
['Você','pediu','calma'].forEach((w,i)=>{
  const s=maskLine(hookBlock,w,{fontSize:HF+'px',lineHeight:'0.98',color:INK},'ab');
  hookLines.push(s);
});
const calmaDot=document.createElement('span');calmaDot.textContent='.';calmaDot.style.display='inline-block';calmaDot.style.transformOrigin='0% 85%';hookLines[2].appendChild(calmaDot);
const piorouWrap=mk(hookBlock,{position:'relative',marginTop:'60px'},'');
const piorou=maskLine(piorouWrap,'Piorou',{fontSize:HF+'px',lineHeight:'0.98',color:INK},'ab');
const baseMark=document.createElement('span');Object.assign(baseMark.style,{display:'inline-block',width:'0',height:'0',verticalAlign:'baseline'});piorou.appendChild(baseMark);
const pDot=document.createElement('span');pDot.textContent='.';pDot.style.color=BRICK;piorou.appendChild(pDot);
hookLines.push(piorou);
const hookSub=mk(hook,{left:'90px',top:'1077px',width:'860px',color:INK},'a ab');
['Para quem convive','com borderline'].forEach(l=>{const d=document.createElement('div');d.textContent=l;d.style.lineHeight='1.06';d.style.whiteSpace='nowrap';hookSub.appendChild(d)});
const hookMB=hookLines.map(()=>mb());

/* =========================================================
   LIST  3.9–6 s   (rebuild of the site's "Sete dias" step list)
   ========================================================= */
const list=mk(cam,{},'scene');
const titleBox=mk(list,{left:'160px',top:'300px',width:'720px'});
const titleL=[maskLine(titleBox,'Um procedimento',{color:INK},'ab'),maskLine(titleBox,'por dia.',{color:INK},'ab')];
const cards=[];
const CARD_TOP=600,CARD_H=112,CARD_GAP=16;
for(let k=0;k<7;k++){
  const c=mk(list,{left:'160px',top:(CARD_TOP+k*(CARD_H+CARD_GAP))+'px',width:'720px',height:CARD_H+'px',background:'#E3D8C2',border:'2px solid rgba(26,26,26,.10)',borderRadius:'22px',zIndex:String(10-k)});
  const n=mk(c,{left:'20px',top:'18px',width:'72px',height:'72px',borderRadius:(72*RR)+'px',background:k===0?'transparent':'rgba(26,26,26,.09)',color:INK,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'34px'},'a ab',k===0?'':String(k+1));
  const t=mk(c,{left:'118px',top:'0',height:CARD_H-4+'px',display:'flex',alignItems:'center',fontSize:'33px',fontWeight:'600',color:INK,whiteSpace:'nowrap'},'a pp',LIST_NAMES[k]);
  cards.push({c,n,t});
}
// the through-line object during hook + list
const obj=mk(cam,{background:BRICK,overflow:'hidden',zIndex:'50'});
const objNum=mk(obj,{left:0,top:0,width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center',color:CREAM},'a ab','1');
const objMB=mb();

/* =========================================================
   DAYS
   ========================================================= */
const dayScenes=[];
function dayHeader(sc,d){
  const hb=mk(sc,{left:'90px',top:'250px',width:'860px'});
  const lab=maskLine(hb,'Dia '+d.n,{fontSize:'40px',fontWeight:'600',letterSpacing:'.06em',color:d.fg,marginBottom:'22px'},'pp');
  const ls=d.name.map(l=>maskLine(hb,l,{color:d.fg,lineHeight:'1.02'},'ab'));
  return {hb,lab,ls};
}
DAYS.forEach((d,i)=>{
  const sc=mk(cam,{},'scene');
  const bg=mk(sc,{left:'-400px',top:'-400px',width:(W+800)+'px',height:(H+800)+'px',background:d.bg});
  const hd=dayHeader(sc,d);
  dayScenes.push({sc,bg,hd,d,T:6+2*i});
});

/* ---- Day 1: bar locks while everything shakes ---- */
const D1=dayScenes[0];
const d1shapes=[];
{ let k=0;
  for(let r=0;r<5;r++)for(let c=0;c<4;c++){
    const y=780+r*125+(hash(k*3+1)-.5)*50, x=150+c*210+(hash(k*3+2)-.5)*70;
    k++; if(Math.abs(y-1010)<95) continue;
    const dot=hash(k*7)>.62, w=dot?24:46+hash(k*5)*80, h=dot?24:16;
    const e=mk(D1.sc,{background:CREAM,opacity:'.55',borderRadius:(dot?12:8)+'px'});
    box(e,x-w/2,y-h/2,w,h); d1shapes.push({e,x,y,w,h});
  }
}
const d1bar=mk(D1.sc,{background:CREAM});

/* ---- Day 2: a line holds ---- */
const D2=dayScenes[1];
const d2line=mk(D2.sc,{background:INK});
const d2tile=mk(D2.sc,{background:INK});
const d2shapes=[{x:205,s:84,c:1},{x:318,s:108,c:0},{x:432,s:72,c:1},{x:545,s:100,c:0},{x:660,s:80,c:1},{x:772,s:112,c:0},{x:880,s:74,c:1}].map(o=>({...o,e:mk(D2.sc,{background:CREAM}),m:mb()}));
const D2_ORDER=[3,0,5,2,6,1,4];

/* ---- Day 3: clock to 20 ---- */
const D3=dayScenes[2];
const CLK={x:520,y:1080};
const d3ring=mk(D3.sc,{background:INK});
const d3hole=mk(D3.sc,{background:D3.d.bg});
const d3grp=mk(D3.sc,{left:(CLK.x-250)+'px',top:(CLK.y-250)+'px',width:'500px',height:'500px'});
const d3wedge=mk(d3grp,{left:'24px',top:'24px',width:'452px',height:'452px',borderRadius:'50%'});
const d3ticks=[];
for(let i=0;i<12;i++){const big=i===4;const len=big?50:32,wd=big?16:10;
  const e=mk(d3grp,{left:(250-wd/2)+'px',top:(250-len/2)+'px',width:wd+'px',height:len+'px',background:INK,borderRadius:wd/2+'px'});d3ticks.push({e,a:i*30,len});}
const d3hand=mk(d3grp,{left:'241px',top:(250-182)+'px',width:'18px',height:'182px',background:INK,borderRadius:'9px',transformOrigin:'50% 100%'});
const d3cap=mk(d3grp,{left:'227px',top:'227px',width:'46px',height:'46px',background:INK,borderRadius:'50%'});

/* ---- Day 4: checklist ---- */
const D4=dayScenes[3];
const D4Y=[860,1040,1220],D4X=190,D4W=[560,470,520];
const d4=D4Y.map((y,k)=>{
  const line=mk(D4.sc,{background:INK,borderRadius:'14px',transformOrigin:'0 50%'});box(line,290,y-14,D4W[k],28);
  const outer=mk(D4.sc,{background:INK,zIndex:String(5-k)});
  const hole=mk(outer,{background:D4.d.bg});
  const NS='http://www.w3.org/2000/svg';const sv=document.createElementNS(NS,'svg');sv.setAttribute('viewBox','0 0 100 100');Object.assign(sv.style,{position:'absolute',left:'0',top:'0',width:'100%',height:'100%'});
  const p=document.createElementNS(NS,'path');p.setAttribute('d','M27 52 L44 68 L74 34');p.setAttribute('fill','none');p.setAttribute('stroke',D4.d.bg);p.setAttribute('stroke-width','11');p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');p.setAttribute('stroke-dasharray','80');sv.appendChild(p);outer.appendChild(sv);
  return {line,outer,hole,p,y};
});

/* ---- Day 5: words fall, one stays ---- */
const D5=dayScenes[4];
const WIN={x:100,y:700,w:840,h:680};
const d5frame=mk(D5.sc,{background:CREAM});
const d5fhole=mk(d5frame,{background:D5.d.bg});
const d5words=mk(D5.sc,{left:WIN.x+'px',top:WIN.y+'px',width:WIN.w+'px',height:WIN.h+'px',display:'flex',flexWrap:'wrap',justifyContent:'center',alignContent:'center',gap:'10px 26px',padding:'44px 40px',boxSizing:'border-box'});
const WORDS=['ontem','sempre','nunca','você disse','mas','porque','quem começou','eu falei','de novo','aquele dia','o tom','a hora','o jeito','toda vez','foi você','não foi assim','lembra','depois','a mensagem','o olhar','o atraso','a porta','o prato','a conta','o celular','a festa','o carro','a viagem','você prometeu','ninguém','tudo','a louça','a resposta','o horário'];
const d5w=WORDS.map((w,i)=>{const e=document.createElement('span');e.textContent=w;Object.assign(e.style,{display:'inline-block',fontFamily:'Poppins',fontWeight:'500',fontSize:'38px',lineHeight:'1.35',color:CREAM,whiteSpace:'nowrap'});d5words.appendChild(e);return {e,w,m:mb(),i}});
const d5keep=d5w.find(o=>o.w==='depois');
const d5tile=mk(D5.sc,{background:CREAM});
const d5fm=mb();

/* ---- Day 6: week grid ---- */
const D6=dayScenes[5];
const G={x:108,y:900,cell:104,gap:16};
const d6grid=mk(D6.sc,{left:'0',top:'0',width:W+'px',height:H+'px'});
const d6cells=[];
for(let r=0;r<2;r++)for(let c=0;c<7;c++){
  const x=G.x+c*(G.cell+G.gap),y=G.y+r*(G.cell+G.gap);
  const o=mk(c===0&&r===0?D6.sc:d6grid,{background:CREAM,zIndex:'3'});const h=mk(o,{background:D6.d.bg});
  d6cells.push({o,h,cx:x+G.cell/2,cy:y+G.cell/2});
}
const d6lab=[];
['D','S','T','Q','Q','S','S'].forEach((l,c)=>{const b=mk(D6.sc,{left:(G.x+c*(G.cell+G.gap))+'px',top:'832px',width:G.cell+'px',textAlign:'center'});d6lab.push(maskLine(b,l,{fontSize:'30px',fontWeight:'600',color:CREAM,opacity:'.75'},'pp'))});

/* ---- Day 7: everything clears, one shape rests ---- */
const D7=dayScenes[6];
const D7C={x:520,y:1060};
const d7icons=[];
function icon(build){const e=mk(D7.sc,{width:'0',height:'0'});build(e);d7icons.push({e,m:mb()});}
icon(e=>{mk(e,{left:'-60px',top:'-12px',width:'120px',height:'24px',background:CREAM,borderRadius:'6px'})});
icon(e=>{mk(e,{left:'-66px',top:'14px',width:'132px',height:'9px',background:CREAM,borderRadius:'5px'});mk(e,{left:'-17px',top:'-20px',width:'34px',height:'34px',background:CREAM,borderRadius:'50%'})});
icon(e=>{mk(e,{left:'-40px',top:'-40px',width:'80px',height:'80px',border:'9px solid '+CREAM,borderRadius:'50%'});mk(e,{left:'-4px',top:'-28px',width:'8px',height:'30px',background:CREAM,borderRadius:'4px',transformOrigin:'50% 100%',transform:'rotate(120deg)'})});
icon(e=>{const b=mk(e,{left:'-36px',top:'-36px',width:'72px',height:'72px',background:CREAM,borderRadius:'19px'});b.innerHTML='<svg viewBox="0 0 100 100" style="position:absolute;left:0;top:0;width:100%;height:100%"><path d="M27 52 L44 68 L74 34" fill="none" stroke="#6B3F73" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>'});
icon(e=>{mk(e,{left:'-80px',top:'-26px',width:'160px',textAlign:'center',fontSize:'34px',fontWeight:'600',color:CREAM},'a pp','depois')});
icon(e=>{for(let r=0;r<2;r++)for(let c=0;c<3;c++)mk(e,{left:(-38+c*27)+'px',top:(-24+r*27)+'px',width:'21px',height:'21px',background:CREAM,borderRadius:'6px'})});
const D7ANG=[-150,-90,-30,30,90,150];
const d7tile=mk(D7.sc,{background:CREAM,overflow:'hidden',zIndex:'4'});
const d7iris=mk(d7tile,{background:INK,borderRadius:'50%'});

/* =========================================================
   END
   ========================================================= */
const end=mk(cam,{},'scene');
const endTile=mk(end,{background:INK,overflow:'hidden'});
const endFS=mk(endTile,{left:0,top:0,width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center'});
const endFSs=document.createElement('span');endFSs.textContent='FS';Object.assign(endFSs.style,{display:'inline-block',fontFamily:'Archivo Black',fontSize:'122px',color:CREAM,lineHeight:'1',letterSpacing:'-.01em'});endFS.appendChild(endFSs);
const eb=mk(end,{left:'90px',top:'880px',width:'860px',textAlign:'center'});
const eName=maskLine(eb,'Dr. Fabio Schmidt',{fontSize:'70px',color:INK,lineHeight:'1.05'},'ab');
const eProd=maskLine(eb,'Protocolo 7 Dias',{fontSize:'44px',fontWeight:'600',color:INK,marginTop:'26px'},'pp');
const eCom=maskLine(eb,'Responda este story com',{fontSize:'40px',fontWeight:'600',color:INK,marginTop:'30px'},'pp');
const eGo=maskLine(eb,'COMEÇAR',{fontSize:'132px',color:BRICK,lineHeight:'1.02'},'ab');
const eLink=maskLine(eb,'e eu te envio o link',{fontSize:'40px',fontWeight:'500',color:INK},'pp');
eGo.parentNode.style.overflow='visible';eGo.style.transformOrigin='50% 55%';
const ef=mk(end,{left:'90px',top:'1385px',width:'860px',textAlign:'center'});
const eFoot=['Conteúdo educativo. Não substitui avaliação nem tratamento.','Dr. Fabio Schmidt, Médico, CRM-SP 183549'].map(l=>maskLine(ef,l,{fontSize:'25px',fontWeight:'400',color:INK,opacity:'.78',lineHeight:'1.5'},'pp'));

/* =========================================================
   FLOOD + CURSOR (top layers)
   ========================================================= */
const flood=mk(cam,{overflow:'hidden',zIndex:'80'});
const iris=mk(flood,{borderRadius:'50%'});
const cursor=mk(cam,{width:'0',height:'0',zIndex:'99'});
cursor.innerHTML='<svg width="50" height="72" viewBox="-3 -3 50 72" style="position:absolute;left:-3px;top:-3px;overflow:visible"><path d="M0 0 L0 54 L14 41 L23 62 L33 57 L24 37 L42 37 Z" fill="#1A1A1A" stroke="#EDE4D3" stroke-width="3.5" stroke-linejoin="round"/></svg>';
const curMB=mb();

/* =========================================================
   MEASURE (match cuts are measured, not hard-coded)
   ========================================================= */
const M={};
function measure(){
  // fit day-name size: one size for all days, widest line fits 860
  const probe=mk(document.body,{position:'absolute',left:'-9999px',fontSize:'100px',whiteSpace:'nowrap'},'ab');
  let maxW=0;DAYS.forEach(d=>d.name.forEach(l=>{probe.textContent=l;maxW=Math.max(maxW,probe.getBoundingClientRect().width)}));
  M.dayFont=Math.min(100,Math.floor(100*860/maxW));
  probe.textContent='Um procedimento';M.titleFont=Math.min(92,Math.floor(100*720/probe.getBoundingClientRect().width));
  probe.textContent='Para quem convive';M.subFont=Math.floor(100*860/probe.getBoundingClientRect().width);
  probe.remove();
  hookSub.style.fontSize=M.subFont+'px';hookSub.style.top=(1152-hookSub.getBoundingClientRect().height/2).toFixed(1)+'px';
  dayScenes.forEach(s=>s.hd.ls.forEach(l=>l.parentNode.style.fontSize=M.dayFont+'px'));
  titleL.forEach(l=>l.parentNode.style.fontSize=M.titleFont+'px');
  // all scenes visible, identity transforms
  [hook,list,end,...dayScenes.map(s=>s.sc)].forEach(e=>vis(e,1));
  cam.style.transform='none';
  // period glyph of "Piorou." -> exact ink box via canvas metrics + baseline marker
  const ctx=document.createElement('canvas').getContext('2d');ctx.font=HF+"px 'Archivo Black'";
  const tm=ctx.measureText('.');const dr=rectOf(pDot),br=rectOf(baseMark);
  M.dot={x:dr.x-tm.actualBoundingBoxLeft,y:br.y-tm.actualBoundingBoxAscent,w:tm.actualBoundingBoxLeft+tm.actualBoundingBoxRight,h:tm.actualBoundingBoxAscent+tm.actualBoundingBoxDescent};
  // row 1 tile in the step list
  M.r1=rectOf(cards[0].n);
  M.row1=rectOf(cards[0].c);
  {const a=rectOf(titleBox),b=rectOf(cards[6].c);M.listMid=(a.y+b.y+b.h)/2;}
  // day 5 words
  d5w.forEach(o=>{o.r=rectOf(o.e)});
  // end: COMEÇAR width for underline
  M.go=rectOf(eGo);
}

/* =========================================================
   CAMERA
   ========================================================= */
function camera(t){
  let Z=1,fx=540,fy=960;
  if(t<4){Z=1+0.04*prog(t,0,4)}
  else if(t<6){const p=easeIO(prog(t,4.0,4.6));Z=1.04*lerp(1,1.3,p);fx=lerp(540,520,p);fy=lerp(960,M.listMid,p)}
  else if(t<20){const T=6+2*Math.floor((t-6)/2);if(T===14){const p=easeIO(prog(t,14.0,14.9));Z=lerp(1,1.15,p);fx=lerp(540,510,p);fy=lerp(960,950,p)}else Z=1+0.04*prog(t,T,T+2)}
  else{Z=1.04+0.04*prog(t,20,24)}
  cam.style.transform=`translate(540px,960px) scale(${Z.toFixed(5)}) translate(${(-fx).toFixed(2)}px,${(-fy).toFixed(2)}px)`;
}

/* =========================================================
   FLOODS: object -> iris of next colour -> past all four corners
   ========================================================= */
function floods(){
  const F=[];
  F.push({a:5.62,ir:0.001,e:6.0,cx:M.r1.cx,cy:M.r1.cy,s:M.r1.w,from:BRICK,to:BRICK});
  const R=[{cx:520,cy:1010,s:140},{cx:530,cy:1080,s:120},{cx:CLK.x,cy:CLK.y,s:140},{cx:D4X,cy:D4Y[2],s:100},{cx:520,cy:1040,s:140},{cx:d6cells[13].cx,cy:d6cells[13].cy,s:G.cell}];

function cursorAt(t){

}
