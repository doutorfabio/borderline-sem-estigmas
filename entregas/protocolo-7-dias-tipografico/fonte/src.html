<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Protocolo 7 Dias, filme tipográfico</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;background:#0D0D0D;}
  body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;min-height:100dvh;}
  canvas{display:block;width:min(100vw, calc(100vh * 9 / 16));width:min(100vw, calc(100dvh * 9 / 16));height:auto;background:#0D0D0D;}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>/*OPENTYPE*/</script>
<script>
"use strict";
// ===========================================================================
// Fontes embutidas (WOFF em base64). Os contornos são lidos com opentype.js
// e desenhados como caminhos: nada depende de fonte instalada nem de rede.
// ===========================================================================
const FONT_B64 = {
  serif: "/*BODONI600*/",
  heavy: "/*ARCHIVOBLACK*/",
  mont7: "/*MONT700*/",
  mont5: "/*MONT500*/"
};
function b64ToBuf(b64){ const s = atob(b64); const u = new Uint8Array(s.length); for (let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u.buffer; }
const F = {}; for (const k in FONT_B64) F[k] = opentype.parse(b64ToBuf(FONT_B64[k]));

// ===========================================================================
// Constantes
// ===========================================================================
const W = 1080, H = 1920, FPS = 30, DUR = 15.0;
const BG = "#0D0D0D", PAPER = "#F2EADB", RED = "#CC0000";
const SAFE = { l: W*0.05, r: W*(1-0.12), t: H*0.08, b: H*(1-0.20) };  // 54, 950.4, 153.6, 1536
const SW = SAFE.r - SAFE.l, XC = SAFE.l + SW/2;
const G = 1400;                           // linha do chão: base das colunas, topo do piso
const A1 = -1.4*Math.PI/180;              // inclinação da laje na abertura
const A2 =  2.0*Math.PI/180;              // inclinação da laje sobre IMPROVISA
const TF = 0.34;                          // duração da queda de cada letra de IMPROVISA
const B2 = 690;                           // linha de base da segunda linha da frase 1

// Tabela de deixas (s). Segue frases, pausas e ênfase da fala, não uma batida.
const CUES = {
  voce: 0.55, improvisa: 0.78,            // Na crise do borderline, [pausa] você improvisa.
  wipe0: 2.60, wipe1: 2.84,               // improvisa passa para a grotesca pesada
  fall0: 2.86, fallGap: 0.022,            // as letras caem para o chão
  slab: 3.06,                             // a laje desce sobre elas
  cada: [3.80, 3.92, 4.03, 4.11, 4.21],   // Cada vez de um jeito.
  col: k => 5.05 + 0.3*k,                 // 1 a 7, um a cada 0,3 s
  sete: [7.45, 7.60], seteOut: [8.40, 8.60],
  piso: 8.62,                             // Um procedimento por dia.
  cam: 11.00,
  p7: [11.60, 11.74, 11.86], pq: 12.05,   // Protocolo 7 Dias. Para quem convive com borderline.
  bf: [12.60, 12.80, 13.00], rodape: [12.90, 13.40]
};

const cv = document.getElementById("c");
const mainCtx = cv.getContext("2d");
const tmp = document.createElement("canvas"); tmp.width = W; tmp.height = H;
const acc = document.createElement("canvas"); acc.width = W; acc.height = H;
const tmpCtx = tmp.getContext("2d"), accCtx = acc.getContext("2d");
let ctx = tmpCtx;

// ===========================================================================
// Tipografia: corridas de glifos com o contorno real de cada letra
// ===========================================================================
function run(font, text, size, track){
  track = track || 0;
  const glyphs = font.stringToGlyphs(text);
  const sc = size / font.unitsPerEm;
  const items = []; let x = 0;
  for (let i=0;i<glyphs.length;i++){
    const g = glyphs[i];
    const p = g.getPath(0, 0, size);
    const bb = p.getBoundingBox();
    const empty = !isFinite(bb.x1) || bb.x1 === bb.x2;
    items.push({ ch: text[i], x, path: new Path2D(p.toPathData(3)), bb, empty });
    x += g.advanceWidth*sc + track*size;
    if (i < glyphs.length-1) x += font.getKerningValue(g, glyphs[i+1]) * sc;
  }
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for (const it of items){ if (it.empty) continue;
    x0=Math.min(x0,it.x+it.bb.x1); x1=Math.max(x1,it.x+it.bb.x2); y0=Math.min(y0,it.bb.y1); y1=Math.max(y1,it.bb.y2); }
  const words = []; let cur = null;
  items.forEach((it,i)=>{ if (it.empty){ cur = null; return; }
    if (!cur){ cur = { i0:i, i1:i, x0: it.x+it.bb.x1, x1: it.x+it.bb.x2 }; words.push(cur); }
    else { cur.i1 = i; cur.x0 = Math.min(cur.x0, it.x+it.bb.x1); cur.x1 = Math.max(cur.x1, it.x+it.bb.x2); } });
  return { items, words, width: x, ink: {x0,y0,x1,y1}, size, colors: {} };
}
function fit(font, text, maxW, maxSize, track){
  const r = run(font, text, 100, track); return Math.min(maxSize || 1e9, 100 * maxW / (r.ink.x1 - r.ink.x0));
}

// ===========================================================================
// Curvas de tempo. Tudo analítico: o quadro depende só de t.
// ===========================================================================
const clamp01 = x => Math.max(0, Math.min(1, x));
const lerp = (a,b,u) => a + (b-a)*u;
const smooth = u => { u = clamp01(u); return u*u*(3-2*u); };
function ease(t, t0, t1){ return smooth((t-t0)/(t1-t0)); }
function easeInOutSine(t, t0, t1){ const u = clamp01((t-t0)/(t1-t0)); return 0.5 - 0.5*Math.cos(Math.PI*u); }
function easeInQuad(t, t0, t1){ const u = clamp01((t-t0)/(t1-t0)); return u*u; }
// Amortecimento crítico 0 → 1, sem ultrapassar, chegando exatamente a 1 em t0+T.
function cd(t, t0, w, T){
  if (t <= t0) return 0; const tau = t - t0; if (tau >= T) return 1;
  const f = x => 1 - (1 + w*x)*Math.exp(-w*x);
  return Math.min(1, f(tau)/f(T));
}

// ===========================================================================
// Layout, calculado uma vez
// ===========================================================================
const L = {};
(function layout(){
  // Laje: CRISE em proporção natural, de margem a margem
  L.crise = run(F.heavy, "CRISE", fit(F.heavy, "CRISE", SW - 20, 0, -0.012), -0.012);
  L.hS = -L.crise.ink.y0;
  L.criseW = L.crise.ink.x1 - L.crise.ink.x0;
  L.YBF = SAFE.t + 16 + L.hS;                                                   // laje nivelada no alto
  L.YB0 = SAFE.t + 8 + L.hS*Math.cos(A1) + (L.criseW/2)*Math.abs(Math.sin(A1)); // abertura do filme

  // Frase 1, em serifa, duas linhas
  const s1 = Math.min(fit(F.serif, "Na crise do borderline,", SW - 4, 86), fit(F.serif, "você improvisa.", SW - 4, 86));
  L.l1 = run(F.serif, "Na crise do borderline,", s1);
  L.l2 = run(F.serif, "você improvisa.", s1);
  for (let i=12;i<22;i++) L.l1.colors[i] = RED;                                  // a palavra borderline
  L.l1X = SAFE.l - L.l1.ink.x0; L.l2X = SAFE.l - L.l2.ink.x0;
  L.asc1 = L.l1.ink.y0;
  // palavra improvisa (sem o ponto): índices 5 a 13 da linha 2
  let wx0 = Infinity, wx1 = -Infinity;
  for (let i=5;i<=13;i++){ const it = L.l2.items[i]; wx0 = Math.min(wx0, it.x+it.bb.x1); wx1 = Math.max(wx1, it.x+it.bb.x2); }
  L.wordX0 = L.l2X + wx0; L.wordX1 = L.l2X + wx1;
  const lead1 = 88;
  L.YB1 = B2 - lead1 + L.asc1 - 14 - Math.tan(-A1)*(XC - SAFE.l);               // laje a 14 px das ascendentes

  // IMPROVISA em grotesca pesada
  L.imp = run(F.heavy, "IMPROVISA", fit(F.heavy, "IMPROVISA", SW - 40, 0, 0.03), 0.03);
  L.impCap = -L.imp.ink.y0;
  L.impX0 = XC - (L.imp.ink.x0 + L.imp.ink.x1)/2;
  L.impSrcScale = (L.wordX1 - L.wordX0) / (L.imp.ink.x1 - L.imp.ink.x0);        // mesma largura da palavra em serifa
  const ROT = [-3.5, 4, -2.5, 5, -4.5, 2.5, 4.5, -3, 5].map(d => d*Math.PI/180); // tabela fixa, sem aleatório
  L.props = L.imp.items.map((it,i)=>{
    const gcx = (it.bb.x1 + it.bb.x2)/2;
    return { it, i, rot: ROT[i], gcx, w: it.bb.x2 - it.bb.x1,
             tx: L.impX0 + it.x + gcx,
             srcX: L.wordX0 + (it.x + gcx - L.imp.ink.x0) * L.impSrcScale };
  });

  // Frases em serifa
  L.cada = run(F.serif, "Cada vez de um jeito.", fit(F.serif, "Cada vez de um jeito.", SW - 4, 86));
  L.sete = run(F.serif, "Sete dias.", 112);

  // Colunas: 1 a 7 em proporção natural; o fuste é o traço de cima prolongado
  const digits = ["1","2","3","4","5","6","7"];
  const DEPTH = [0.18, 0.105, 0.11, 0.07, 0.06, 0.11, 0.06];
  const slot = SW / 7;
  let dsz = 1e9; for (const d of digits) dsz = Math.min(dsz, fit(F.heavy, d, slot - 14));
  L.cols = digits.map((d,k)=>{ const it = run(F.heavy, d, dsz).items[0];
    const w = it.bb.x2 - it.bb.x1, hInk = it.bb.y2 - it.bb.y1;
    return { it, k, cx: SAFE.l + slot*(k+0.5), w, gcx: (it.bb.x1+it.bb.x2)/2, h: -it.bb.y1, hInk,
             cutLocal: it.bb.y1 + DEPTH[k]*hInk, cutDepth: DEPTH[k]*hInk }; });
  L.stepT = digits.map((_,k)=> CUES.col(k) + (k===0 ? 0.10 : 0.27));

  // Piso
  L.piso = run(F.heavy, "UM PROCEDIMENTO POR DIA", fit(F.heavy, "UM PROCEDIMENTO POR DIA", SW));
  L.pisoCap = -L.piso.ink.y0;

  // Fecho
  L.camD = G - 470;                                                             // piso no terço de cima
  L.p7 = run(F.serif, "Protocolo 7 Dias.", fit(F.serif, "Protocolo 7 Dias.", SW - 4, 124));
  L.pq = run(F.serif, "Para quem convive com borderline.", fit(F.serif, "Para quem convive com borderline.", SW - 4, 58));
  let k1 = 1; { const a = run(F.mont7, "Black Friday: cupom ", 50), b = run(F.mont7, "BLACK26", 74); k1 = Math.min(1, (SW - 4) / (a.width + b.ink.x1)); }
  L.bf1a = run(F.mont7, "Black Friday: cupom ", 50*k1);
  L.bf1b = run(F.mont7, "BLACK26", 74*k1);
  L.bf2 = run(F.mont7, "25% de desconto: R$ 164,25", fit(F.mont7, "25% de desconto: R$ 164,25", SW - 4, 60));
  L.bf3 = run(F.mont7, "Até 25/11. Garantia de 7 dias", 50);
  L.ft = ["Conteúdo educativo. Não substitui", "avaliação nem tratamento.", "Dr. Fabio Schmidt, médico, CRM-SP 183549."].map(s => run(F.mont5, s, 30));
})();

// ===========================================================================
// Laje: pose em função do tempo
// ===========================================================================
const under = (x, p) => p.yb + Math.tan(p.a)*(x - XC);          // face de baixo
const topOf = (x, p) => under(x, p) - L.hS/Math.cos(p.a);       // face de cima
function loadSy(pr, pose){                                      // quanto a laje comprime cada letra
  const uy = Math.max(under(pr.tx - pr.w/2, pose), under(pr.tx + pr.w/2, pose));
  const th = Math.abs(pr.rot);
  return Math.max(0.2, Math.min(1, ((G - uy) - pr.w*Math.sin(th)) / (L.impCap*Math.cos(th))));
}
(function solveRest(){                                          // repouso: a laje encosta em todas; a menos carregada fica em 96%
  let lo = G - 2*L.impCap, hi = G;
  for (let n=0;n<50;n++){ const mid = (lo+hi)/2; let m = 0; for (const pr of L.props) m = Math.max(m, loadSy(pr, {yb: mid, a: A2}));
    if (m > 0.96) lo = mid; else hi = mid; }
  L.YB2 = (lo+hi)/2;
  for (const pr of L.props) pr.rest = loadSy(pr, {yb: L.YB2, a: A2});
})();
function slabPose(t){
  let yb = lerp(L.YB0, L.YB1, easeInOutSine(t, 0.2, 2.6)), a = A1;
  if (t > CUES.slab){ const p = cd(t, CUES.slab, 6.2, 1.15); yb = lerp(L.YB1, L.YB2, p); a = lerp(A1, A2, p); }
  if (t >= 5.0){ let S = 0; for (let k=0;k<7;k++) S += cd(t, L.stepT[k], 14, 0.5); S /= 7;
    yb = lerp(L.YB2, L.YBF, S); a = A2*(1 - S); }
  return { yb, a };
}
// cada letra de IMPROVISA sai por baixo antes da coluna que sobe no lugar dela
(function exits(){
  L.exitT = L.props.map(pr => {
    const a = pr.tx - pr.w/2 - 16, b = pr.tx + pr.w/2 + 16;
    for (const c of L.cols){ if (b > c.cx - c.w/2 && a < c.cx + c.w/2) return CUES.col(c.k) - 0.02; }
    return CUES.col(6) - 0.02;
  });
})();

// ===========================================================================
// Desenho
// ===========================================================================
function fillItems(r, i0, i1, color){
  for (let i=i0;i<=i1;i++){ const it = r.items[i]; if (it.empty) continue;
    ctx.fillStyle = r.colors[i] || color; ctx.save(); ctx.translate(it.x, 0); ctx.fill(it.path); ctx.restore(); }
}
// palavra que sobe de trás da própria linha de base (máscara), com amortecimento crítico
function drawWord(r, w, x, y, color, p, descFrac){
  if (p <= 0) return;
  const asc = r.size*0.92, desc = r.size*(descFrac || 0.30);
  ctx.save(); ctx.beginPath(); ctx.rect(x + w.x0 - 6, y - asc, (w.x1 - w.x0) + 12, asc + desc); ctx.clip();
  ctx.translate(x, y + (1-p)*(asc + desc)); fillItems(r, w.i0, w.i1, color); ctx.restore();
}
function drawPhrase(r, x, y, color, t, cues){
  r.words.forEach((w,i)=> drawWord(r, w, x, y, color, cd(t, cues[Math.min(i, cues.length-1)], 16, 0.34)));
}
function drawLine(parts, x, y, p){                               // linha inteira com a mesma máscara
  if (p <= 0) return;
  let size = 0, x1 = 0; for (const q of parts){ size = Math.max(size, q.r.size); x1 = Math.max(x1, q.dx + q.r.ink.x1); }
  const asc = size*0.92, desc = size*0.30;
  ctx.save(); ctx.beginPath(); ctx.rect(x - 6, y - asc, x1 + 12, asc + desc); ctx.clip();
  ctx.translate(x, y + (1-p)*(asc + desc));
  for (const q of parts){ ctx.save(); ctx.translate(q.dx, 0); fillItems(q.r, 0, q.r.items.length-1, q.color); ctx.restore(); }
  ctx.restore();
}

let CLIP_SAFE = true;
function scene(t){
  t = Math.max(0, Math.min(DUR, t));
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1;
  ctx.fillStyle = BG; ctx.fillRect(0,0,W,H);
  ctx.save();
  if (CLIP_SAFE){ ctx.beginPath(); ctx.rect(SAFE.l, SAFE.t, SAFE.r - SAFE.l, SAFE.b - SAFE.t); ctx.clip(); }

  const camP = cd(t, CUES.cam, 6.5, 1.15), cam = L.camD * camP;
  ctx.translate(0, -cam);
  const pose = slabPose(t);

  // ---- Frase 1: Na crise do borderline, / você improvisa. ---------------------
  if (t < 3.7){
    const lead = lerp(100, 88, ease(t, 1.5, 2.6));
    ctx.save();
    // oclusão: a frase só existe abaixo da face de baixo da laje
    ctx.beginPath(); ctx.moveTo(-10, under(-10, pose) + 2); ctx.lineTo(W+10, under(W+10, pose) + 2); ctx.lineTo(W+10, H*2); ctx.lineTo(-10, H*2); ctx.closePath(); ctx.clip();
    ctx.save(); ctx.translate(L.l1X, B2 - lead); fillItems(L.l1, 0, L.l1.items.length-1, PAPER); ctx.restore();
    drawWord(L.l2, L.l2.words[0], L.l2X, B2, PAPER, cd(t, CUES.voce, 16, 0.34));
    const pw = cd(t, CUES.improvisa, 16, 0.34);
    if (pw > 0){
      const asc = L.l2.size*0.92, desc = L.l2.size*0.30;
      // ponto final
      ctx.save(); ctx.beginPath(); ctx.rect(L.wordX1 - 2, B2 - asc, 60, asc + desc); ctx.clip();
      ctx.translate(L.l2X, B2 + (1-pw)*(asc+desc)); fillItems(L.l2, 14, 14, PAPER); ctx.restore();
      // palavra em serifa: some por trás da borda que varre a palavra
      const e = lerp(L.wordX0 - 4, L.wordX1 + 4, ease(t, CUES.wipe0, CUES.wipe1));
      if (t < CUES.wipe1){
        ctx.save(); ctx.beginPath(); ctx.rect(Math.max(e, L.wordX0 - 6), B2 - asc, L.wordX1 + 8 - Math.max(e, L.wordX0 - 6), asc + desc); ctx.clip();
        ctx.translate(L.l2X, B2 + (1-pw)*(asc+desc)); fillItems(L.l2, 5, 13, PAPER); ctx.restore();
      }
    }
    ctx.restore();
  }

  // ---- IMPROVISA: palavra pesada, queda, apoio torto, saída por baixo ---------
  if (t >= CUES.wipe0 && t < 7.2){
    ctx.save(); ctx.beginPath();
    if (t < CUES.wipe1){ const e = lerp(L.wordX0 - 4, L.wordX1 + 4, ease(t, CUES.wipe0, CUES.wipe1)); ctx.rect(-W, -H, W + e, H + G + 3); }
    else ctx.rect(-W, -H, 3*W, H + G + 3);
    ctx.clip(); ctx.fillStyle = PAPER;
    const tRel = L.stepT[0] + 0.08;
    for (const pr of L.props){
      const ex = L.exitT[pr.i]; if (t >= ex) continue;
      const f = CUES.fall0 + CUES.fallGap*pr.i, u = clamp01((t - f)/TF), tau = t - (f + TF);
      let sy = 1;
      if (tau > 0){ sy = 1 - 0.22*Math.exp(-10*tau)*Math.sin(24*tau);              // quique elástico ao tocar o chão
        sy = Math.min(sy, loadSy(pr, pose)); }                                     // compressão sob a laje
      if (t > tRel){ const q = t - tRel; sy *= 1 + (1 - pr.rest)*0.45*Math.exp(-9*q)*Math.sin(22*q); } // alívio
      const sx = 1 + 0.2*(1 - sy);
      const lift = (pr.w*sx/2)*Math.abs(Math.sin(pr.rot));
      const x = lerp(pr.srcX, pr.tx, smooth(u)), y = lerp(B2, G - lift, u*u);
      const sc = lerp(L.impSrcScale, 1, smooth(u/0.75)), rot = pr.rot*Math.pow(u, 1.5);
      const drop = easeInQuad(t, ex - 0.26, ex) * (L.impCap*1.25 + 30);
      ctx.save(); ctx.translate(x, y + drop); ctx.rotate(rot); ctx.scale(sc*sx, sc*sy); ctx.translate(-pr.gcx, 0); ctx.fill(pr.it.path); ctx.restore();
    }
    ctx.restore();
  }

  // ---- Colunas 1 a 7 ----------------------------------------------------------
  if (t >= CUES.col(0)){
    ctx.save();
    ctx.beginPath(); ctx.rect(-W, -H*2, 3*W, H*2 + G + 3); ctx.clip();                      // chão
    ctx.beginPath(); ctx.moveTo(-10, under(-10, pose) - 0.5); ctx.lineTo(W+10, under(W+10, pose) - 0.5); ctx.lineTo(W+10, H*3); ctx.lineTo(-10, H*3); ctx.closePath(); ctx.clip(); // laje
    ctx.fillStyle = PAPER;
    for (const c of L.cols){
      const c0 = CUES.col(c.k), e = cd(t, c0, 20, 0.34); if (e <= 0) continue;
      const ul = under(c.cx - c.w/2, pose), ur = under(c.cx + c.w/2, pose);
      const yTop = Math.max(G - c.h*e, Math.max(ul, ur));                // o número não atravessa a laje
      const cutY = yTop + c.cutDepth;
      // número, do corte para baixo
      ctx.save(); ctx.beginPath(); ctx.rect(-W, cutY - 0.4, 3*W, H*3); ctx.clip();
      ctx.translate(c.cx - c.gcx, yTop + c.h); ctx.fill(c.it.path); ctx.restore();
      // fuste: a seção do traço de cima, prolongada até a laje
      const sTop = lerp(cutY, Math.min(ul, ur) - 4, cd(t, c0 + 0.10, 18, 0.30));
      if (sTop < cutY - 0.01){ const band = 0.6;
        ctx.save(); ctx.beginPath(); ctx.rect(-W, sTop, 3*W, cutY - sTop + 0.8); ctx.clip();
        ctx.translate(c.cx - c.gcx, cutY); ctx.scale(1, (cutY - sTop)/band); ctx.translate(0, -c.cutLocal - band); ctx.fill(c.it.path); ctx.restore(); }
    }
    ctx.restore();
  }

  // ---- Laje CRISE -------------------------------------------------------------
  ctx.save(); ctx.translate(XC, pose.yb); ctx.rotate(pose.a); ctx.translate(-(L.crise.ink.x0 + L.crise.ink.x1)/2, 0);
  fillItems(L.crise, 0, L.crise.items.length-1, PAPER); ctx.restore();

  // ---- Cada vez de um jeito. (some por trás da laje que sobe) -----------------
  if (t >= CUES.cada[0] && t < 7.0){
    ctx.save(); ctx.beginPath(); ctx.moveTo(-10, topOf(-10, pose) - 3); ctx.lineTo(W+10, topOf(W+10, pose) - 3); ctx.lineTo(W+10, -H); ctx.lineTo(-10, -H); ctx.closePath(); ctx.clip();
    drawPhrase(L.cada, SAFE.l - L.cada.ink.x0, 720, PAPER, t, CUES.cada);
    ctx.restore();
  }

  // ---- Sete dias. -------------------------------------------------------------
  if (t >= CUES.sete[0] && t < CUES.seteOut[1]){
    const out = ease(t, CUES.seteOut[0], CUES.seteOut[1]);
    L.sete.words.forEach((w,i)=> drawWord(L.sete, w, SAFE.l - L.sete.ink.x0, 1504, PAPER, cd(t, CUES.sete[i], 16, 0.34) * (1 - out), 0.16));
  }

  // ---- Piso: UM PROCEDIMENTO POR DIA, letra a letra, de uma margem à outra ----
  if (t >= CUES.piso){
    const base = G + L.pisoCap, x = SAFE.l - L.piso.ink.x0;
    ctx.save(); ctx.beginPath(); ctx.rect(-W, G - 40, 3*W, L.pisoCap + 41); ctx.clip(); ctx.fillStyle = RED;
    let j = 0;
    for (const it of L.piso.items){ if (it.empty) continue;
      const p = cd(t, CUES.piso + 0.02*j, 16, 0.42); j++;
      if (p <= 0) continue;
      ctx.save(); ctx.translate(x + it.x, base + (1-p)*(L.pisoCap + 10)); ctx.fill(it.path); ctx.restore(); }
    ctx.restore();
  }

  // ---- Névoa no alto: a estrutura some para cima quando a câmera desce ---------
  if (camP > 0){
    ctx.save(); ctx.translate(0, cam);
    const g = ctx.createLinearGradient(0, SAFE.t, 0, SAFE.t + 200);
    g.addColorStop(0, "rgba(13,13,13," + camP + ")"); g.addColorStop(0.25, "rgba(13,13,13," + (0.82*camP) + ")"); g.addColorStop(1, "rgba(13,13,13,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, SAFE.t + 200);
    ctx.restore();
  }

  // ---- Fecho (coordenadas de tela finais; acompanha a câmera) ------------------
  const wy = y => y + L.camD;
  if (t >= CUES.p7[0]){
    drawPhrase(L.p7, SAFE.l - L.p7.ink.x0, wy(692), PAPER, t, CUES.p7);
    drawLine([{ r: L.pq, dx: -L.pq.ink.x0, color: PAPER }], SAFE.l, wy(774), cd(t, CUES.pq, 16, 0.38));
  }
  if (t >= CUES.bf[0]){
    drawLine([{ r: L.bf1a, dx: -L.bf1a.ink.x0, color: PAPER }, { r: L.bf1b, dx: -L.bf1a.ink.x0 + L.bf1a.width, color: RED }], SAFE.l, wy(952), cd(t, CUES.bf[0], 16, 0.38));
    drawLine([{ r: L.bf2, dx: -L.bf2.ink.x0, color: PAPER }], SAFE.l, wy(1046), cd(t, CUES.bf[1], 16, 0.38));
    drawLine([{ r: L.bf3, dx: -L.bf3.ink.x0, color: PAPER }], SAFE.l, wy(1128), cd(t, CUES.bf[2], 16, 0.38));
    const af = ease(t, CUES.rodape[0], CUES.rodape[1]);
    if (af > 0){ ctx.save(); ctx.globalAlpha = 0.8*af;
      L.ft.forEach((r,i)=>{ ctx.save(); ctx.translate(SAFE.l - r.ink.x0, wy(1392 + 40*i)); fillItems(r, 0, r.items.length-1, PAPER); ctx.restore(); });
      ctx.restore(); }
  }
  ctx.restore();
}

// ===========================================================================
// Renderizador determinístico: window.seek(t)
// Cada quadro é a média de N instantes dentro do obturador (desfoque de
// movimento analítico). Não há estado acumulado entre quadros.
// ===========================================================================
let SAMPLES = 8; const SHUTTER = 0.5 / FPS;
function seek(t, samples){
  const n = samples || SAMPLES;
  if (n <= 1){ ctx = mainCtx; scene(t); return; }
  ctx = tmpCtx;
  for (let i=0;i<n;i++){
    scene(t + ((i + 0.5)/n - 0.5) * SHUTTER);
    accCtx.globalAlpha = 1/(i+1); accCtx.drawImage(tmp, 0, 0);
  }
  mainCtx.setTransform(1,0,0,1,0,0); mainCtx.globalAlpha = 1; mainCtx.drawImage(acc, 0, 0);
}
window.seek = seek;
window.FRAMES = Math.round(DUR*FPS);   // 450 quadros, t = n/30
window.SAFE = SAFE; window.CUES = CUES; window.L = L;
window.setSafeClip = v => { CLIP_SAFE = !!v; };
window.slabPose = slabPose;

// prévia em tempo real quando aberto direto no navegador
if (!navigator.webdriver){
  const t0 = performance.now();
  (function loop(){ const t = ((performance.now() - t0)/1000) % (DUR + 1.2); seek(Math.min(t, DUR), 3); requestAnimationFrame(loop); })();
} else { seek(0); }
</script>
