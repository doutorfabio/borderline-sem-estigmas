 background:radial-gradient(closest-side,rgba(201,162,75,.16),rgba(201,162,75,0) 70%)}

/* phone */
#phone{left:162px;top:236px;width:756px;height:1344px;border-radius:46px;overflow:hidden;background:#000;
 box-shadow:0 0 0 2px rgba(217,181,106,.6),0 40px 90px rgba(0,0,0,.7),0 0 120px rgba(201,162,75,.12)}
#rec{position:absolute;left:0;top:0;width:756px;height:1344px}
#shade{position:absolute;left:0;top:1040px;width:756px;height:304px;background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.86) 46%,rgba(0,0,0,.92))}
#label{top:202px;left:0;width:1080px;text-align:center}
#label span{display:inline-block;height:68px;line-height:66px;padding:0 40px 0 46px;border-radius:34px;background:rgba(14,11,10,.92);
 border:1.5px solid rgba(217,181,106,.75);font-family:Mont;font-weight:600;font-size:30px;letter-spacing:.26em;color:#E3C27A;box-shadow:0 10px 30px rgba(0,0,0,.6)}
/* caption */
#cap{top:1388px;left:0;width:1080px;text-align:center;font-family:Mont;font-weight:800;font-size:62px;color:#fff;
 -webkit-text-stroke:7px rgba(0,0,0,.55);paint-order:stroke fill;text-shadow:0 4px 16px rgba(0,0,0,.85);white-space:nowrap}
#cap b{font-weight:900;color:#FF4A44;font-size:66px}
/* closing */
#close{left:0;top:0;width:1080px;height:1920px}
#lj{top:300px;width:1080px;text-align:center;font-family:Mont;font-weight:600;font-size:30px;letter-spacing:.5em;color:#D9B56A}
#fil{top:352px;left:440px;width:200px;height:2px;background:linear-gradient(90deg,rgba(217,181,106,0),#D9B56A,rgba(217,181,106,0))}
#lb{top:376px;width:1080px;text-align:center;font-family:Corm;font-weight:600;font-size:132px;letter-spacing:.045em;color:#fff;line-height:1.05}
#ls{top:536px;width:1080px;text-align:center;font-family:Mont;font-weight:500;font-size:34px;letter-spacing:.52em;color:#e9e2d6}
.cv{top:728px;width:196px;height:262px;border-radius:10px;overflow:hidden;box-shadow:0 24px 40px rgba(0,0,0,.6)}
.cv img{position:absolute;left:-14px;top:-8px;width:226px}
#shelf{top:1002px;left:90px;width:900px;height:5px;border-radius:3px;background:linear-gradient(90deg,rgba(217,181,106,0),#C9A24B 12%,#E3C27A 50%,#C9A24B 88%,rgba(217,181,106,0));box-shadow:0 10px 24px rgba(0,0,0,.7)}
#btn{top:1076px;left:250px;width:580px;height:112px;border-radius:56px;background:linear-gradient(#e0322c,#b5201c);
 box-shadow:0 18px 40px rgba(181,32,28,.45),inset 0 2px 0 rgba(255,255,255,.25);text-align:center;line-height:112px;font-family:Mont;font-weight:800;font-size:46px;letter-spacing:.12em;color:#fff;overflow:hidden}
#shine{position:absolute;top:0;left:0;width:160px;height:112px;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.35),rgba(255,255,255,0))}
#url{top:1222px;width:1080px;text-align:center;font-family:Inter;font-weight:500;font-size:40px;color:#f2ece2;letter-spacing:.02em}
#sub{top:1290px;width:1080px;text-align:center;font-family:Mont;font-weight:600;font-size:26px;letter-spacing:.2em;color:rgba(217,181,106,.9)}
#grain{left:0;top:0;width:1080px;height:1920px;opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
</style></head>
<body><div id="stage">
<div id="glow" class="abs"></div>

<div id="open" class="abs">
 <div id="h1" class="abs">DEPOIS DA CRISE DO</div>
 <div id="h2" class="abs">BORDERLINE,</div>
 <div id="h3" class="abs">VOCÊ PESQUISA<br>O QUE FAZER.</div>
 <div id="clock" class="abs">03:12</div>
 <div id="clocksub" class="abs">DE MADRUGADA</div>
 <div id="search" class="abs">
  <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#D9B56A" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
  <div id="q"><span id="qt"></span><span id="caret"></span></div>
 </div>
 <div class="abs sk" id="sk1" style="top:1180px;width:620px"></div>
 <div class="abs sk" id="sk2" style="top:1226px;width:780px"></div>
 <div class="abs sk" id="sk3" style="top:1272px;width:480px"></div>
</div>

<div id="phone" class="abs"><img id="rec"><div id="shade"></div></div>
<div id="label" class="abs"><span id="lt"></span></div>

<div id="close" class="abs">
 <div id="lj" class="abs">LOJA</div><div id="fil" class="abs"></div>
 <div id="lb" class="abs">BORDERLINE</div>
 <div id="ls" class="abs">SEM ESTIGMA</div>
 <div class="abs cv" id="c0"><img src="covers/p7d.jpg"></div>
 <div class="abs cv" id="c1"><img src="covers/crise.jpg"></div>
 <div class="abs cv" id="c2"><img src="covers/kit.jpg"></div>
 <div class="abs cv" id="c3"><img src="covers/livro.jpg"></div>
 <div id="shelf" class="abs"></div>
 <div id="btn" class="abs">LINK NA BIO<div id="shine"></div></div>
 <div id="url" class="abs">drfabioschmidt.net/loja</div>
 <div id="sub" class="abs">GUIAS A PARTIR DE R$ 27 · 3 GRATUITOS</div>
</div>

<div id="cap" class="abs"></div>
<div id="grain" class="abs"></div>
</div>
<script src="data.js"></script>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const eb=x=>{x=cl(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const SEG={A:[0,31],B:[32,101],C:[102,140],D:[141,168],E:[171,192],G:[237,341]};
const LAB={A:"A LOJA",B:"PARA QUEM CONVIVE",C:"PARA QUEM CONVIVE",D:"PARA QUEM TEM TPB",E:"LIVRO",G:"3 GRATUITOS"};
const QUERY="o que fazer na crise do borderline";
const cache={};
function frameSrc(i){return "rec/"+String(i+1).padStart(4,"0")+".jpg"}
window.render=function(t){
  const S=window.SC, O=S.open, C=S.close;
  // ---------- opening
  const op=$("open");
  const oOut=eo((t-(O[1]-0.22))/0.22);
  op.style.opacity=t<O[1]?1-oOut:0;
  op.style.transform=`translateY(${-60*oOut}px)`;
  const k=cl((t-0.35)/2.5); $("qt").textContent=QUERY.slice(0,Math.round(QUERY.length*k));
  $("caret").style.opacity=(Math.floor(t*2.5)%2===0||k<1)?1:0;
  const se=eo((t-0.05)/0.45); $("search").style.opacity=se; $("search").style.transform=`translateY(${(1-se)*40}px)`;
  const ce=eo(t/0.5); $("clock").style.opacity=ce; $("clocksub").style.opacity=ce;
  ["sk1","sk2","sk3"].forEach((id,n)=>{const e=eo((t-(2.95+n*0.12))/0.3); $(id).style.opacity=e; $(id).style.transform=`translateX(${(1-e)*-30}px)`});
  const pu=1+0.012*Math.sin(t*2.2); $("h2").style.transform=`scale(${pu})`;
  // ---------- phone
  const ph=$("phone"), inPh=t>=O[1]-0.05&&t<C[0]+0.4;
  if(t>=O[1]-0.25&&t<C[0]+0.45){
    let key="A"; for(const kk of ["A","B","C","D","E","G"]) if(t>=S[kk][0]) key=kk;
    const [a,b]=SEG[key], [t0,t1]=S[key];
    const rate=Math.max(1,(b-a+1)/((t1-t0)*30));
    const idx=Math.min(b,a+Math.max(0,Math.round((t-t0)*30*rate)));
    $("rec").src=frameSrc(idx);
    const e=eb((t-(O[1]-0.2))/0.5), out=eo((t-(C[0]+0.02))/0.4);
    ph.style.opacity=cl((t-(O[1]-0.2))/0.2)*(1-out);
    const z=1+0.035*cl((t-O[1])/(C[0]-O[1]));
    ph.style.transform=`translateY(${(1-e)*260-out*120}px) scale(${(0.9+0.1*e)*z*(1-0.12*out)})`;
    // label
    const lt=$("lt"); lt.textContent=LAB[key];
    const firstOfLabel=["A","B","C","D","E","G"].find(kk=>LAB[kk]===LAB[key]);
    const le=eb((t-S[firstOfLabel][0]-0.05)/0.32);
    $("label").style.opacity=cl((t-S[firstOfLabel][0]-0.05)/0.12)*(1-out);
    $("label").style.transform=`translateY(${(1-le)*-24}px) scale(${0.86+0.14*le})`;
  } else { ph.style.opacity=0; $("label").style.opacity=0; }
  // ---------- closing
  const cs=$("close"), ct=t-C[0]-0.18;
  cs.style.opacity=t>=C[0]+0.1?1:0;
  const a1=eo(ct/0.4); $("lj").style.opacity=a1; $("fil").style.opacity=a1; $("fil").style.transform=`scaleX(${a1})`;
  const a2=eo((ct-0.08)/0.5); $("lb").style.opacity=a2; $("lb").style.transform=`translateY(${(1-a2)*36}px)`; $("lb").style.letterSpacing=(0.02+0.025*a2)+"em";
  const a3=eo((ct-0.25)/0.5); $("ls").style.opacity=a3;
  const xs=[92,324,556,788]; const rot=[-4,-1.5,1.5,4];
  for(let n=0;n<4;n++){const e=eb((ct-0.35-n*0.11)/0.45); const el=$("c"+n); el.style.left=xs[n]+"px"; el.style.opacity=cl((ct-0.35-n*0.11)/0.15);
    el.style.transform=`translateY(${(1-e)*120+Math.sin(t*1.6+n)*3}px) rotate(${rot[n]*(1-0.6*e)}deg)`;}
  const a4=eo((ct-0.3)/0.5); $("shelf").style.opacity=a4; $("shelf").style.transform=`scaleX(${a4})`;
  const a5=eb((ct-0.85)/0.4); $("btn").style.opacity=cl((ct-0.85)/0.15); $("btn").style.transform=`scale(${0.8+0.2*a5})`;
  const sh=((ct-1.3)%1.6)/0.7; $("shine").style.transform=`translateX(${-200+cl(sh)*900}px)`; $("shine").style.opacity=ct>1.3?1:0;
  const a6=eo((ct-1.1)/0.4); $("url").style.opacity=a6; $("url").style.transform=`translateY(${(1-a6)*20}px)`;
  const a7=eo((ct-1.35)/0.4); $("sub").style.opacity=a7;
  const fade=cl((window.DUR-t)/0.12); $("stage").style.opacity=fade;
  // ---------- caption
  const cap=$("cap"); let cur=null; for(const c of window.CAPS) if(t>=c.t0&&t<c.t1) cur=c;
  if(cur){ cap.innerHTML=cur.txt.split(" ").map(w=>(w.length>1&&w===w.toUpperCase()&&/[A-ZÀ-Ý]/.test(w))?"<b>"+w+"</b>":w).join(" ");
    const e=eb((t-cur.t0)/0.14); cap.style.opacity=cl((t-cur.t0)/0.05); cap.style.transform=`scale(${0.9+0.1*e})`; }
  else cap.style.opacity=0;
  const im=$("rec"); return (im.getAttribute("src")&&!im.complete)?new Promise(r=>{im.onload=r;im.onerror=r}):Promise.resolve();
};
</script></body></html>
