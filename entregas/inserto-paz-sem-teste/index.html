<filter id="fp1" filterUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920"><feGaussianBlur id="gp1" stdDeviation="0 0"/></filter>
<filter id="fp2" filterUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920"><feGaussianBlur id="gp2" stdDeviation="0 0"/></filter>
<clipPath id="cLabel"><rect id="cLabelR" x="540" y="300" width="0" height="90"/></clipPath>
<clipPath id="cB1"><rect id="cB1R"/></clipPath>
<clipPath id="cPaz"><rect x="0" y="0" width="1080" height="933"/></clipPath>
</defs>
<rect width="1080" height="1920" fill="#1F7A74"/>
<g id="cam">
  <g clip-path="url(#cLabel)"><text id="label" x="546" y="357" text-anchor="middle" font-family="Poppins" font-weight="600" font-size="36" letter-spacing="12" fill="#EDE4D3">SOZINHO</text></g>
  <g clip-path="url(#cPaz)" id="paz"></g>
  <g id="b1" filter="url(#fb1)"><rect id="b1r" fill="#1A1A1A"/><g clip-path="url(#cB1)"><text id="b1t" class="ab" font-size="56" fill="#EDE4D3">ATRASO</text></g></g>
  <g id="b2" filter="url(#fb2)"><rect id="b2r" fill="#1A1A1A" width="380" height="130"/><text id="b2t" class="ab" font-size="56" fill="#EDE4D3">SILÊNCIO</text></g>
  <path id="line" fill="none" stroke="#1A1A1A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <g id="tag"><rect id="tagr" fill="#A62B24" height="120"/><text id="tagt" class="ab" font-size="66" fill="#EDE4D3" x="540" y="84">SEM TESTE</text></g>
  <text id="probe" font-family="Archivo Black" font-size="340" fill="none" x="0" y="0">PAZ</text>
</g></svg>
<script>
const $=id=>document.getElementById(id), cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const LY=940,X0=170,X1=910,L=X1-X0;
// easing as functions of time
const spring=(t,z=0.7,w=16)=>{if(t<=0)return 0;const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+z*w/wd*Math.sin(wd*t));};
const expoOut=u=>u>=1?1:u<=0?0:1-Math.pow(2,-10*u);
const inCubic=u=>{u=cl(u);return u*u*u;};
const ioSine=u=>{u=cl(u);return .5-.5*Math.cos(Math.PI*u);};
// simply supported beam, unit point load at a, normalised so a centre load gives 1 at the centre
function beam(x,a){a-=X0;x-=X0;if(a<=0||a>=L||x<=0||x>=L)return 0;const b=L-a;
  const v=x<=a?b*x*(L*L-b*b-x*x):a*(L-x)*(L*L-a*a-(L-x)*(L-x));return v/(Math.pow(L,4)/8);}
// block 1 ATRASO
const B1={w:300,h:130,D:85};
function p1(t){if(t<1.0)return 420;if(t<1.2)return 420-14*ioSine((t-1)/.2);return 406+920*inCubic((t-1.2)/.5);}
function g1(t){return spring(t-.5,.7,18);}
const R1=1.2+.5*Math.cbrt((X1-406)/920);
// block 2 SILÊNCIO
const B2={w:380,h:130,D:100};
function p2(t){if(t<2.5)return -260+910*expoOut((t-2)/.5);if(t<2.7)return 650-14*ioSine((t-2.5)/.2);return 636+760*inCubic((t-2.7)/.5);}
const R2=2.7+.5*Math.cbrt((X1-636)/760);
const ring=(t,r)=>{const k=t-r;return k<=0?0:-16*Math.exp(-12*k)*Math.sin(22*k);};
function load(t){return [[p1(t),t<.5?0:B1.D*cl(g1(t),0,1.05)],[p2(t),t>=2?B2.D:0]];}
function defl(x,t){let y=0;for(const [p,d] of load(t))y+=d*beam(x,p);
  return y+(ring(t,R1)+ring(t,R2))*Math.sin(Math.PI*cl((x-X0)/L));}
let PZ=null,TW=0,LW=0;
function setup(){
  const NS='http://www.w3.org/2000/svg',pr=$('probe'),W=pr.getComputedTextLength(),sx=540-W/2;PZ=[];
  for(let i=0;i<3;i++){const x=sx+pr.getStartPositionOfChar(i).x;
    const g=document.createElementNS(NS,'g');g.setAttribute('filter','url(#fp'+i+')');
    const e=document.createElementNS(NS,'text');
    e.setAttribute('font-family','Archivo Black');e.setAttribute('font-size','340');e.setAttribute('fill','#EDE4D3');
    e.setAttribute('x',x);e.textContent='PAZ'[i];g.appendChild(e);$('paz').appendChild(g);PZ.push(e);}
  pr.remove();
  TW=$('tagt').getComputedTextLength()+96;LW=$('label').getComputedTextLength()+40;
}
window.seek=function(t){
  const dt=1/720,vel=f=>(f(t+dt)-f(t-dt))/(2*dt);
  // camera never rests: one continuous push, each bar starts where the last ended
  const s=1+.08*t/8;$('cam').setAttribute('transform','translate(540 900) scale('+s+') translate(-540 -900)');
  // label: wiped in from the centre, wiped out before the tag lands
  let lw=LW*expoOut((t-.1)/.45);if(t>5.5)lw=LW*(1-ioSine((t-5.5)/.35));
  $('cLabelR').setAttribute('x',540-lw/2);$('cLabelR').setAttribute('width',lw);
  // line: drawn outward from a short dash, then bent by whatever rests on it
  const half=20+(L/2-20)*expoOut(t/.45),xa=540-half,xb=540+half;let d='';
  for(let i=0;i<=96;i++){const x=xa+(xb-xa)*i/96;d+=(i?'L':'M')+x.toFixed(2)+' '+(LY+defl(x,t)).toFixed(2);}
  $('line').setAttribute('d',d);
  // block 1: grows up out of the line, its label revealed by the block itself
  {const g=cl(g1(t),0,1.05),p=p1(t),h=B1.h*g,bot=LY+defl(p,t)-3,x=p-B1.w/2;
   $('b1').style.display=(t<.5||x>1300)?'none':'';
   for(const id of['b1r','cB1R']){const e=$(id);e.setAttribute('x',x);e.setAttribute('y',bot-h);e.setAttribute('width',B1.w);e.setAttribute('height',Math.max(0,h));}
   $('b1t').setAttribute('x',p);$('b1t').setAttribute('y',bot-B1.h/2+20);
   $('b1').setAttribute('transform','rotate('+(Math.atan((defl(p+40,t)-defl(p-40,t))/80)*57.2958).toFixed(3)+' '+p+' '+bot+')');
   $('gb1').setAttribute('stdDeviation',Math.min(30,Math.abs(vel(p1))/360).toFixed(2)+' 0');}
  // block 2: slides in from the left along the line, the dip travels with it
  {const p=p2(t),bot=LY+defl(p,t)-3,x=p-B2.w/2;
   $('b2').style.display=(t<2||x>1300)?'none':'';
   $('b2r').setAttribute('x',x);$('b2r').setAttribute('y',bot-B2.h);
   $('b2t').setAttribute('x',p);$('b2t').setAttribute('y',bot-B2.h/2+20);
   $('b2').setAttribute('transform','rotate('+(Math.atan((defl(p+40,t)-defl(p-40,t))/80)*57.2958).toFixed(3)+' '+p+' '+bot+')');
   $('gb2').setAttribute('stdDeviation',Math.min(30,Math.abs(vel(p2))/360).toFixed(2)+' 0');}
  // PAZ: each letter rises out of the line on its own beat
  PZ.forEach((e,i)=>{const f=u=>300*(1-spring(u-(4+.5*i),.72,15));
    e.setAttribute('y',(LY-30+f(t)).toFixed(2));e.style.display=t<4+.5*i?'none':'';
    $('gp'+i).setAttribute('stdDeviation','0 '+Math.min(24,Math.abs(vel(f))/360).toFixed(2));});
  // tag: folds down from the line
  {const u=spring(t-6,.7,17),top=LY+5+30*cl(u);
   $('tag').style.display=t<6?'none':'';$('tagr').setAttribute('x',540-TW/2);$('tagr').setAttribute('width',TW);
   $('tag').setAttribute('transform','translate(0 '+top+') scale(1 '+Math.max(.001,u)+')');}
};
window.ready=document.fonts.ready.then(()=>Promise.all([document.fonts.load('56px "Archivo Black"'),document.fonts.load('600 36px Poppins')])).then(()=>{setup();seek(0);});
</script></body></html>
