<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#EDE3D3;font-family:Inter,sans-serif;color:#1B1B1B;position:relative;overflow:hidden}
.wrap{position:absolute;left:118px;right:130px;top:390px}
.kick{font-weight:800;font-size:30px;letter-spacing:4px;color:#B3261E}
h1{font-family:Lora,serif;font-weight:700;font-size:76px;line-height:1.1;margin-top:26px}
.steps{margin-top:70px;display:flex;flex-direction:column;gap:26px}
.st{display:flex;align-items:center;gap:30px;background:#F6F0E6;border:2px solid #D8CCB8;border-radius:28px;padding:32px 34px}
.st.on{background:#B3261E;border-color:#B3261E;color:#fff}
.n{flex:none;width:76px;height:76px;border-radius:50%;background:#B3261E;color:#fff;font-family:Lora,serif;font-weight:700;font-size:40px;display:flex;align-items:center;justify-content:center}
.st.on .n{background:#fff;color:#B3261E}
.ic{flex:none;width:58px;height:58px}
.t{font-weight:700;font-size:38px;line-height:1.18}
.t small{display:block;font-family:Lora,serif;font-style:italic;font-weight:600;font-size:32px;margin-top:8px;opacity:.95}
.foot{margin-top:54px;display:flex;gap:22px;align-items:center;font-weight:600;font-size:34px;line-height:1.25}
.foot svg{flex:none}
</style></head><body><div class="wrap">
<div class="kick">GUIA GRATUITO</div>
<h1>Essa é a terceira frase. Tem duas antes dela.</h1>
<div class="steps">
 <div class="st"><div class="n">1</div><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#1B1B1B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/></svg><div class="t">Baixe a sua voz</div></div>
 <div class="st"><div class="n">2</div><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#1B1B1B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/><path d="M12 15.5s-3.2-1.9-3.2-4a1.7 1.7 0 0 1 3.2-.8 1.7 1.7 0 0 1 3.2.8c0 2.1-3.2 4-3.2 4z"/></svg><div class="t">Diga a emoção que você vê</div></div>
 <div class="st on"><div class="n">3</div><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg><div class="t">Diga o limite e a hora em que você volta<small>Volto em vinte minutos.</small></div></div>
</div>
<div class="foot"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#B3261E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg><div>E o que fazer se alguém pode se machucar.</div></div>
</div></body></html>
