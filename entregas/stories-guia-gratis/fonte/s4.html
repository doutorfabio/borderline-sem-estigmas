<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D0D;font-family:Inter,sans-serif;color:#F3EBDD;position:relative;overflow:hidden}
.wrap{position:absolute;left:132px;right:118px;top:290px}
.kick{font-weight:800;font-size:30px;letter-spacing:4px;color:#E0574C}
h1{font-family:Lora,serif;font-weight:700;font-size:96px;line-height:1;margin-top:18px}
.sub{font-size:34px;line-height:1.3;margin-top:22px;color:#CFC6B8;font-weight:500}
.row{margin-top:48px;display:flex;gap:44px;align-items:flex-start}
.phone{flex:none;width:400px;height:724px;border-radius:58px;background:#222;padding:14px;box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 2px #3a3a3a;transform:rotate(-3deg);transform-origin:center}
.scr{width:100%;height:100%;border-radius:46px;overflow:hidden;background:#EDE3D3}
.scr img{width:100%;display:block}
.side{padding-top:70px;display:flex;flex-direction:column;gap:36px}
.btn{background:#B3261E;border-radius:30px;padding:34px 30px;box-shadow:0 8px 0 #7d1913}
.btn b{display:block;font-size:30px;font-weight:600;color:#F9D9D5}
.btn span{display:block;font-family:Inter;font-weight:800;font-size:52px;letter-spacing:1px;color:#fff;margin-top:6px}
.btn i{display:block;font-style:normal;font-size:30px;font-weight:600;color:#fff;margin-top:10px;line-height:1.25}
.tip{font-size:31px;line-height:1.3;font-weight:500;color:#CFC6B8;display:flex;gap:16px}
.tip svg{flex:none;margin-top:4px}
</style></head><body><div class="wrap">
<div class="kick">PARA QUEM CONVIVE COM BORDERLINE</div>
<h1>Guia grátis</h1>
<div class="sub">O script de 3 passos para atravessar uma crise sem entrar nela junto.</div>
<div class="row">
 <div class="phone"><div class="scr"><img src="guia-top.png"></div></div>
 <div class="side">
  <div class="btn"><b>Responda</b><span>COMEÇAR</span><i>aqui no story que eu te mando no direct.</i></div>
  <div class="tip"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#E0574C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><div>Guarde no celular.<br>Na hora da crise, abra e toque na situação.</div></div>
 </div>
</div>
</div></body></html>
